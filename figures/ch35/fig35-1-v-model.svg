  <text x="450.0" y="58.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">점선: 왼쪽 단계의 결과를 오른쪽 단계가 확인한다 (추적성)</text>
  <text x="450.0" y="476.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">왼쪽으로 내려가며 나누고, 오른쪽으로 올라가며 확인한다. 각 요구 사항이 어느 시험으로 확인되었는지 추적할 수 있어야 한다</text>
