  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 35-1  V 모델 개발 프로세스</text>
  <rect x="60.0" y="70.0" width="230.0" height="54.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
