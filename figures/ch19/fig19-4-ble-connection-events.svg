<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 19-4  BLE 연결 이벤트와 슬립 구간: 대부분의 시간 동안 잔다</text>
  <line x1="110.0" y1="260.0" x2="860.0" y2="260.0" stroke="#616e7c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="110.0" y1="260.0" x2="110.0" y2="80.0" stroke="#616e7c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="102.0" y="86.0" font-size="12" text-anchor="end" fill="#1f2933" font-weight="bold">전류</text>
  <text x="860.0" y="280.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">시간</text>
  <path d="M110,252 L140,252 L140,200 L146,200 L146,110 L154,110 L154,130 L162,130 L162,200 L168,200 L168,252 L290,252 L290,200 L296,200 L296,110 L304,110 L304,130 L312,130 L312,200 L318,200 L318,252 L440,252 L440,200 L446,200 L446,110 L454,110 L454,130 L462,130 L462,200 L468,200 L468,252 L590,252 L590,200 L596,200 L596,110 L604,110 L604,130 L612,130 L612,200 L618,200 L618,252 L740,252 L740,200 L746,200 L746,110 L754,110 L754,130 L762,130 L762,200 L768,200 L768,252 L850,252" stroke="#2f6fdf" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="154.0" y="100.0" font-size="10" text-anchor="middle" fill="#2f6fdf" font-weight="normal">송신</text>
  <text x="180.0" y="124.0" font-size="10" text-anchor="middle" fill="#2f6fdf" font-weight="normal">수신</text>
  <text x="220.0" y="244.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">슬립 (µA 수준)</text>
  <line x1="140.0" y1="282.0" x2="290.0" y2="282.0" stroke="#334e68" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="215.0" y="300.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">연결 간격 (예: 100 ms)</text>
  <text x="440.0" y="300.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">이벤트 하나 = 수 ms 이하</text>
  <text x="450.0" y="330.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">연결 간격을 늘리면 평균 전류가 줄고 반응이 느려진다. 11장의 평균 전류 계산이 그대로 적용된다</text>
</svg>
