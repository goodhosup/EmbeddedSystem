<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 19-5  TCP/IP 계층과 ESP-IDF 구성 요소의 대응</text>
  <rect x="40.0" y="60.0" width="160.0" height="50.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="120.0" y="90.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">응용 계층</text>
  <rect x="210.0" y="60.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#2f6fdf" stroke-width="1"/>
  <text x="370.0" y="90.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">HTTP, MQTT(20장), SNTP, DNS</text>
  <line x1="532.0" y1="85.0" x2="566.0" y2="85.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570.0" y="60.0" width="300.0" height="50.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <text x="720.0" y="90.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">esp_http_client, esp-mqtt, esp_sntp</text>
  <rect x="40.0" y="120.0" width="160.0" height="50.0" rx="6" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="120.0" y="150.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">전송 계층</text>
  <rect x="210.0" y="120.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
  <text x="370.0" y="150.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">TCP (연결, 재전송), UDP</text>
  <line x1="532.0" y1="145.0" x2="566.0" y2="145.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570.0" y="120.0" width="300.0" height="50.0" rx="6" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1"/>
  <text x="720.0" y="150.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">LwIP (소켓 API)</text>
  <rect x="40.0" y="180.0" width="160.0" height="50.0" rx="6" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="120.0" y="210.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">네트워크 계층</text>
  <rect x="210.0" y="180.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
  <text x="370.0" y="210.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">IP 주소, 라우팅</text>
  <line x1="532.0" y1="205.0" x2="566.0" y2="205.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570.0" y="180.0" width="300.0" height="50.0" rx="6" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1"/>
  <text x="720.0" y="210.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">LwIP, esp_netif (DHCP로 IP 받기)</text>
  <rect x="40.0" y="240.0" width="160.0" height="50.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="120.0" y="270.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">링크 계층</text>
  <rect x="210.0" y="240.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#d9730d" stroke-width="1"/>
  <text x="370.0" y="270.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">Wi-Fi(802.11) MAC, 암호화(WPA2/WPA3)</text>
  <line x1="532.0" y1="265.0" x2="566.0" y2="265.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570.0" y="240.0" width="300.0" height="50.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <text x="720.0" y="270.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">esp_wifi 드라이버</text>
  <rect x="40.0" y="300.0" width="160.0" height="50.0" rx="6" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="120.0" y="330.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">물리 계층</text>
  <rect x="210.0" y="300.0" width="320.0" height="50.0" rx="6" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="370.0" y="330.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">2.4 GHz 무선, 안테나</text>
  <line x1="532.0" y1="325.0" x2="566.0" y2="325.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570.0" y="300.0" width="300.0" height="50.0" rx="6" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <text x="720.0" y="330.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">ESP32 칩 내장 RF</text>
  <text x="370.0" y="52.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">하는 일</text>
  <text x="720.0" y="52.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">ESP-IDF에서 맡는 부분</text>
  <text x="450.0" y="380.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">LwIP는 임베디드용 경량 TCP/IP 스택이다. 우리 코드는 대개 맨 위 계층의 API만 부른다</text>
</svg>
