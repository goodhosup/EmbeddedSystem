  <text x="450.0" y="396.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">광고는 데이터 채널 37개를 피한 광고 전용 채널 3개(37, 38, 39)에서 보낸다. 연결 뒤에는 데이터 채널을 바꿔 가며(주파수 도약) 통신한다</text>
