  <text x="450.0" y="420.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">스트림마다 8개 채널 중 하나를 고른다. 어느 주변장치가 어느 스트림·채널에 있는지는 RM0383의 DMA 요청 표에서 찾는다</text>
