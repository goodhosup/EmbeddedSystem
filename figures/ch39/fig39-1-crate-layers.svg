<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 39-1  Rust 임베디드 크레이트 계층</text>
  <rect x="80.0" y="60.0" width="520.0" height="60.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="100.0" y="85.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">애플리케이션</text>
  <text x="100.0" y="105.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">src/main.rs</text>
  <rect x="80.0" y="132.0" width="520.0" height="60.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.6"/>
  <text x="100.0" y="157.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">BSP (보드 지원)</text>
  <text x="100.0" y="177.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">nucleo-f411re 등: 보드의 LED, 버튼 이름</text>
  <text x="620.0" y="167.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">← 선택</text>
  <rect x="80.0" y="204.0" width="520.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="100.0" y="229.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">HAL</text>
  <text x="100.0" y="249.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">stm32f4xx-hal, embassy-stm32: 안전한 주변장치 API</text>
  <rect x="80.0" y="276.0" width="520.0" height="60.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.6"/>
  <text x="100.0" y="301.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">PAC (주변장치 접근 크레이트)</text>
  <text x="100.0" y="321.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">stm32f4: SVD에서 자동 생성한 레지스터</text>
  <text x="620.0" y="311.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">← 4장의 regs.h</text>
  <rect x="80.0" y="348.0" width="520.0" height="60.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.6"/>
  <text x="100.0" y="373.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">코어 지원</text>
  <text x="100.0" y="393.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">cortex-m (NVIC, SysTick), cortex-m-rt (벡터 테이블, 시작 코드)</text>
  <text x="620.0" y="383.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">← 21장의 startup.c</text>
  <line x1="602.0" y1="236.0" x2="638.0" y2="236.0" stroke="#2f6fdf" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="640.0" y="200.0" width="230.0" height="70.0" rx="8" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.4"/>
  <text x="755.0" y="226.0" font-size="13" text-anchor="middle" fill="#2f6fdf" font-weight="bold">embedded-hal 1.0</text>
  <text x="755.0" y="246.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">I2C, SPI, GPIO, 지연의 공통 트레이트</text>
  <text x="755.0" y="262.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">센서 드라이버는 이것만 쓴다 (15장의 i2c.h)</text>
  <text x="450.0" y="440.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">아래로 갈수록 칩에 가깝고 unsafe가 많다. 위 계층은 아래가 감싼 안전한 API만 쓴다</text>
  <text x="450.0" y="460.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">센서 드라이버 크레이트는 embedded-hal 트레이트로 쓰여 있어 어느 MCU의 HAL과도 조합된다</text>
</svg>
