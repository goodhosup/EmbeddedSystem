<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 30-3  전류 프로파일 (예시)</text>
  <line x1="110.0" y1="330.0" x2="840.0" y2="330.0" stroke="#334e68" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="110.0" y1="330.0" x2="110.0" y2="70.0" stroke="#334e68" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="840.0" y="350.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">시간</text>
  <text x="102.0" y="76.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">전류</text>
  <path d="M110,321.0 L110,321.0 L180,321.0 L180,306.0 L184,306.0 L184,300.0 L186,300.0 L186,321.0 L360,321.0 L360,306.0 L364,306.0 L364,300.0 L366,300.0 L366,321.0 L540,321.0 L540,306.0 L544,306.0 L544,300.0 L546,300.0 L546,150.0 L570,150.0 L570,240.0 L580,240.0 L580,321.0 L720,321.0 L720,306.0 L724,306.0 L724,300.0 L726,300.0 L726,321.0 L830,321.0" stroke="#2f6fdf" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="270.0" y="311.0" font-size="11" text-anchor="middle" fill="#2f6fdf" font-weight="normal">잠 (틱 없는 Idle, WFI)</text>
  <text x="182.0" y="290.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="bold">측정</text>
  <text x="362.0" y="290.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="bold">측정</text>
  <text x="558.0" y="140.0" font-size="11" text-anchor="middle" fill="#d9730d" font-weight="bold">SD 카드 쓰기 (f_sync)</text>
  <line x1="184.0" y1="344.0" x2="364.0" y2="344.0" stroke="#334e68" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="274.0" y="360.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">측정 주기 1 s</text>
  <text x="450.0" y="384.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">평균 전류 ≈ 잠 전류 + (깨어 있는 시간 비율 × 깨어 있을 때 전류). 대부분 잠에서 보내므로 잠 전류와 SD 쓰기 빈도가 수명을 정한다</text>
  <text x="450.0" y="404.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">그래프의 크기는 설명을 위한 예시다. 실제 값은 NUCLEO의 IDD 점퍼와 전류계로 잰다</text>
</svg>
