<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 30-1  하드웨어 연결도</text>
  <rect x="330.0" y="70.0" width="240.0" height="320.0" rx="10" fill="#e3edfd" stroke="#2f6fdf" stroke-width="2"/>
  <text x="450.0" y="96.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">NUCLEO-F411RE</text>
  <text x="450.0" y="114.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">STM32F411RE, HSI 16 MHz</text>
  <rect x="40.0" y="100.0" width="180.0" height="70.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="130.0" y="132.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">BMP280 모듈</text>
  <text x="130.0" y="151.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">I2C 주소 0x76 (SDO = GND)</text>
  <line x1="222.0" y1="130.0" x2="326.0" y2="130.0" stroke="#2f9e44" stroke-width="2"/>
  <text x="274.0" y="126.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="bold">SCL</text>
  <text x="338.0" y="134.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PB8 (D15)</text>
  <line x1="222.0" y1="150.0" x2="326.0" y2="150.0" stroke="#2f9e44" stroke-width="2"/>
  <text x="274.0" y="146.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="bold">SDA</text>
  <text x="338.0" y="154.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PB9 (D14)</text>
  <text x="130.0" y="190.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">VCC 3.3 V, GND</text>
  <rect x="40.0" y="230.0" width="180.0" height="110.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="130.0" y="282.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">microSD 모듈</text>
  <text x="130.0" y="301.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">SPI 모드</text>
  <line x1="222.0" y1="250.0" x2="326.0" y2="250.0" stroke="#d9730d" stroke-width="2"/>
  <text x="274.0" y="246.0" font-size="10" text-anchor="middle" fill="#d9730d" font-weight="bold">SCK</text>
  <text x="338.0" y="254.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PA5 (D13)</text>
  <line x1="222.0" y1="270.0" x2="326.0" y2="270.0" stroke="#d9730d" stroke-width="2"/>
  <text x="274.0" y="266.0" font-size="10" text-anchor="middle" fill="#d9730d" font-weight="bold">MISO</text>
  <text x="338.0" y="274.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PA6 (D12)</text>
  <line x1="222.0" y1="290.0" x2="326.0" y2="290.0" stroke="#d9730d" stroke-width="2"/>
  <text x="274.0" y="286.0" font-size="10" text-anchor="middle" fill="#d9730d" font-weight="bold">MOSI</text>
  <text x="338.0" y="294.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PA7 (D11)</text>
  <line x1="222.0" y1="310.0" x2="326.0" y2="310.0" stroke="#d9730d" stroke-width="2"/>
  <text x="274.0" y="306.0" font-size="10" text-anchor="middle" fill="#d9730d" font-weight="bold">CS</text>
  <text x="338.0" y="314.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">PB6 (D10)</text>
  <text x="130.0" y="360.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">VCC 3.3 V, GND (+ 100 µF 근처에)</text>
  <rect x="680.0" y="160.0" width="180.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="770.0" y="192.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">PC</text>
  <text x="770.0" y="211.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">시리얼 터미널 115200</text>
  <line x1="572.0" y1="195.0" x2="676.0" y2="195.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="624.0" y="186.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">USB (ST-LINK)</text>
  <text x="560.0" y="220.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="normal">USART2 PA2/PA3</text>
  <text x="560.0" y="236.0" font-size="10" text-anchor="end" fill="#616e7c" font-weight="normal">TX는 DMA1 스트림 6</text>
  <text x="560.0" y="330.0" font-size="10" text-anchor="end" fill="#d64545" font-weight="normal">PA5 = LD2와 같은 핀:</text>
  <text x="560.0" y="346.0" font-size="10" text-anchor="end" fill="#d64545" font-weight="normal">LED는 쓰지 않는다</text>
  <text x="450.0" y="418.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">15장의 BMP280과 16장의 SPI 연결을 그대로 쓴다. SD 카드는 쓰는 순간 수십 mA를 끌어가므로 전원선을 짧게, 커패시터를 가까이</text>
  <text x="450.0" y="438.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">SD 모듈 중 5 V용 레귤레이터와 레벨 변환기가 달린 것은 3.3 V 전원에서 동작하는지 확인한다</text>
</svg>
