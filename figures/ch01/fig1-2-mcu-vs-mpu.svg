  <text x="685.0" y="158.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">4 GB</text>
  <rect x="490.0" y="187.0" width="120.0" height="60.0" rx="8" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
