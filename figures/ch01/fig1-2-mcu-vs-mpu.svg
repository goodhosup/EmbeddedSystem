<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="410.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 1-2  MCU와 MPU 시스템 비교</text>
  <text x="205.0" y="62.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">MCU: 칩 하나에 거의 모든 것</text>
  <rect x="60.0" y="75.0" width="290.0" height="200.0" rx="12" fill="#e3edfd" stroke="#2f6fdf" stroke-width="2"/>
