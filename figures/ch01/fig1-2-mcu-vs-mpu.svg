  <line x1="612.0" y1="142.0" x2="628.0" y2="142.0" stroke="#d9730d" stroke-width="2"/>
  <line x1="550.0" y1="174.0" x2="550.0" y2="185.0" stroke="#d9730d" stroke-width="2"/>
  <text x="615.0" y="300.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">리눅스 같은 범용 OS · 수백 mA 이상 · 부팅 수 초</text>
