  <text x="270.0" y="158.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">512 KB</text>
  <rect x="80.0" y="187.0" width="120.0" height="60.0" rx="8" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="140.0" y="214.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">SRAM</text>
  <text x="140.0" y="233.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">128 KB</text>
  <rect x="210.0" y="187.0" width="120.0" height="60.0" rx="8" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.5"/>
