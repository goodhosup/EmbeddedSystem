  <text x="270.0" y="233.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">GPIO, ADC, ...</text>
  <text x="205.0" y="300.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">운영체제 없이(베어메탈) 또는 RTOS · 수 mA · 즉시 부팅</text>
  <text x="615.0" y="62.0" font-size="14" text-anchor="middle" fill="#d9730d" font-weight="bold">MPU: 외부 메모리와 운영체제</text>
  <rect x="470.0" y="75.0" width="290.0" height="200.0" rx="12" fill="#fafbfc" stroke="#616e7c" stroke-width="1.2"/>
