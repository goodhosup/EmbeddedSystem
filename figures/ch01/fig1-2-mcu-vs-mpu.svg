  <text x="140.0" y="158.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">100 MHz</text>
  <rect x="210.0" y="112.0" width="120.0" height="60.0" rx="8" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.5"/>
