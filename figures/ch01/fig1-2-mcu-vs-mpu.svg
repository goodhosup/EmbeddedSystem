  <text x="550.0" y="158.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">CPU 1.5 GHz</text>
  <rect x="630.0" y="112.0" width="110.0" height="60.0" rx="8" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
