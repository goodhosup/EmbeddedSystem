<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 24-2  상태 머신 다이어그램 예시 (세탁기)</text>
  <rect x="60.0" y="90.0" width="170.0" height="62.0" rx="18" fill="#eef1f4" stroke="#334e68" stroke-width="1.6"/>
  <text x="145.0" y="116.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">IDLE</text>
  <text x="145.0" y="136.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">모두 정지</text>
  <rect x="250.0" y="90.0" width="170.0" height="62.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="335.0" y="116.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">FILLING</text>
  <text x="335.0" y="136.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">문 잠금, 밸브 열기</text>
  <rect x="440.0" y="90.0" width="170.0" height="62.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="525.0" y="116.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">WASHING</text>
  <text x="525.0" y="136.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">모터 세탁, 10초</text>
  <rect x="630.0" y="90.0" width="170.0" height="62.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="715.0" y="116.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DRAINING</text>
  <text x="715.0" y="136.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">펌프 켜기</text>
  <rect x="630.0" y="250.0" width="170.0" height="62.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="715.0" y="276.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">SPINNING</text>
  <text x="715.0" y="296.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">펌프, 모터 탈수, 5초</text>
  <rect x="440.0" y="250.0" width="170.0" height="62.0" rx="18" fill="#eef1f4" stroke="#334e68" stroke-width="1.6"/>
  <text x="525.0" y="276.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">DONE</text>
  <text x="525.0" y="296.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">문 잠금 해제</text>
  <rect x="250.0" y="380.0" width="170.0" height="62.0" rx="18" fill="#fdebd7" stroke="#d9730d" stroke-width="1.6"/>
  <text x="335.0" y="406.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">PAUSED</text>
  <text x="335.0" y="426.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">출력 모두 정지</text>
  <line x1="232.0" y1="121.0" x2="248.0" y2="121.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="240.0" y="112.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold"></text>
  <text x="240.0" y="80.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">START</text>
  <line x1="422.0" y1="121.0" x2="438.0" y2="121.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="430.0" y="80.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">FULL</text>
  <line x1="612.0" y1="121.0" x2="628.0" y2="121.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="620.0" y="80.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">TIMEOUT</text>
  <line x1="715.0" y1="154.0" x2="715.0" y2="248.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="722.0" y="206.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="bold">EMPTY</text>
  <line x1="628.0" y1="281.0" x2="612.0" y2="281.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="620.0" y="334.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">TIMEOUT</text>
  <path d="M440,281 L145,281 L145,154" stroke="#334e68" stroke-width="1.8" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="290.0" y="274.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">DOOR_OPEN</text>
  <path d="M335,154 L335,376" stroke="#d9730d" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="345.0" y="352.0" font-size="11" text-anchor="start" fill="#d9730d" font-weight="bold">동작 중(파란 상태 어디서든)</text>
  <text x="345.0" y="368.0" font-size="11" text-anchor="start" fill="#d9730d" font-weight="bold">START</text>
  <path d="M250,411 L120,411 L120,250 L270,250 L270,156" stroke="#d9730d" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="110.0" y="430.0" font-size="11" text-anchor="start" fill="#d9730d" font-weight="bold">START: 멈췄던 단계로</text>
  <rect x="500.0" y="370.0" width="360.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="516.0" y="394.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">읽는 법</text>
  <text x="516.0" y="414.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">상자 = 상태, 아래 글자 = 들어갈 때 하는 일(entry)</text>
  <text x="516.0" y="434.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">화살표 = 이벤트로 일어나는 전이</text>
  <text x="516.0" y="454.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">표시 없는 이벤트는 그 상태에서 무시 (예: 세탁 중 DOOR_OPEN)</text>
</svg>
