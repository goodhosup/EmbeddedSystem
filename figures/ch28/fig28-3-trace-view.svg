  <text x="602.0" y="330.0" font-size="10" text-anchor="middle" fill="#d64545" font-weight="normal">② log가 뮤텍스를 기다리는 동안 그것을 쥔 console이 실행</text>
  <text x="193.2" y="98.0" font-size="10" text-anchor="start" fill="#d64545" font-weight="normal">① ISR: 세로 막대</text>
  <text x="362.0" y="338.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">③ 높은 태스크에 밀려 log가 쪼개짐 (선점)</text>
  <text x="60.0" y="380.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">① ISR이 언제, 얼마나 자주, 얼마나 오래 실행되는지 → 인터럽트 부하</text>
  <text x="60.0" y="402.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">② 태스크가 무엇을 기다리며 멈췄는지(큐, 뮤텍스) → 우선순위 역전, 데드락의 단서</text>
  <text x="60.0" y="424.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">③ 각 태스크가 깨어나서 끝날 때까지의 응답 시간과 선점 횟수 → 28.4절의 분석과 비교</text>
  <text x="60.0" y="446.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">④ Idle 비율 = 남은 CPU 여유. Idle이 거의 없으면 마감을 놓치기 직전이다</text>
