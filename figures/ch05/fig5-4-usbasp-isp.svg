<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="440.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 5-4  USBasp와 ATmega128의 ISP 연결</text>
  <text x="135.0" y="66.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">USBasp 10핀 ISP 커넥터</text>
  <text x="135.0" y="84.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(위에서 본 모습, ▶가 1번 핀)</text>
  <rect x="65.0" y="100.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="95.0" y="117.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">1</text>
  <text x="95.0" y="133.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">MOSI</text>
  <rect x="135.0" y="100.0" width="60.0" height="40.0" rx="4" fill="#ffffff" stroke="#616e7c" stroke-width="1.2"/>
  <text x="165.0" y="117.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">2</text>
  <text x="165.0" y="133.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">VCC</text>
  <rect x="65.0" y="152.0" width="60.0" height="40.0" rx="4" fill="#ffffff" stroke="#616e7c" stroke-width="1.2"/>
  <text x="95.0" y="169.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">3</text>
  <text x="95.0" y="185.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">NC</text>
  <rect x="135.0" y="152.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="165.0" y="169.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">4</text>
  <text x="165.0" y="185.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">GND</text>
  <rect x="65.0" y="204.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="95.0" y="221.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">5</text>
  <text x="95.0" y="237.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">RST</text>
  <rect x="135.0" y="204.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="165.0" y="221.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">6</text>
  <text x="165.0" y="237.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">GND</text>
  <rect x="65.0" y="256.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="95.0" y="273.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">7</text>
  <text x="95.0" y="289.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">SCK</text>
  <rect x="135.0" y="256.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="165.0" y="273.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">8</text>
  <text x="165.0" y="289.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">GND</text>
  <rect x="65.0" y="308.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="95.0" y="325.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">9</text>
  <text x="95.0" y="341.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">MISO</text>
  <rect x="135.0" y="308.0" width="60.0" height="40.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="165.0" y="325.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">10</text>
  <text x="165.0" y="341.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">GND</text>
  <polygon points="51.0,114.0 61.0,120.0 51.0,126.0" fill="#2f6fdf" stroke="#2f6fdf" stroke-width="1"/>
  <rect x="520.0" y="80.0" width="300.0" height="270.0" rx="12" fill="#fafbfc" stroke="#d9730d" stroke-width="1.5"/>
  <text x="670.0" y="104.0" font-size="15" text-anchor="middle" fill="#d9730d" font-weight="bold">ATmega128A</text>
  <text x="400.0" y="104.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="bold">USBasp 핀</text>
  <rect x="340.0" y="125.0" width="120.0" height="34.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="400.0" y="147.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">1번 MOSI</text>
  <line x1="462.0" y1="142.0" x2="536.0" y2="142.0" stroke="#d9730d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="125.0" width="120.0" height="34.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="600.0" y="147.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">PE0 (PDI)</text>
  <text x="672.0" y="147.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">데이터 입력</text>
  <rect x="340.0" y="169.0" width="120.0" height="34.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="400.0" y="191.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">9번 MISO</text>
  <line x1="462.0" y1="186.0" x2="536.0" y2="186.0" stroke="#d9730d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="169.0" width="120.0" height="34.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="600.0" y="191.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">PE1 (PDO)</text>
  <text x="672.0" y="191.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">데이터 출력</text>
  <rect x="340.0" y="213.0" width="120.0" height="34.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="400.0" y="235.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">7번 SCK</text>
  <line x1="462.0" y1="230.0" x2="536.0" y2="230.0" stroke="#d9730d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="213.0" width="120.0" height="34.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="600.0" y="235.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">PB1 (SCK)</text>
  <text x="672.0" y="235.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">클럭</text>
  <rect x="340.0" y="257.0" width="120.0" height="34.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="400.0" y="279.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">5번 RST</text>
  <line x1="462.0" y1="274.0" x2="536.0" y2="274.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="257.0" width="120.0" height="34.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="600.0" y="279.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">RESET</text>
  <text x="672.0" y="279.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">리셋</text>
  <rect x="340.0" y="301.0" width="120.0" height="34.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.2"/>
  <text x="400.0" y="323.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">4·6·8·10번</text>
  <line x1="462.0" y1="318.0" x2="536.0" y2="318.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="301.0" width="120.0" height="34.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="600.0" y="323.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">GND</text>
  <text x="672.0" y="323.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">공통 접지</text>
  <rect x="60.0" y="370.0" width="760.0" height="46.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.2"/>
  <text x="440.0" y="391.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">주의: ATmega128의 ISP는 SPI 핀(PB2 MOSI, PB3 MISO)이 아니라 PE0, PE1을 쓴다</text>
  <text x="440.0" y="408.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">키트의 ISP 커넥터가 이미 올바르게 배선되어 있는지 회로도로 확인한다</text>
</svg>
