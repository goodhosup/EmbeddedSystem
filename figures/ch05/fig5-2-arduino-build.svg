<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 5-2  아두이노 IDE가 [업로드] 버튼 뒤에서 하는 일</text>
  <rect x="20.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="83.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">스케치</text>
  <text x="83.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">.ino</text>
  <line x1="149.0" y1="100.0" x2="165.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="167.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="230.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">전처리</text>
  <text x="230.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">.cpp로 변환</text>
  <line x1="296.0" y1="100.0" x2="312.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="314.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="377.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">컴파일</text>
  <text x="377.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">avr-g++</text>
  <line x1="443.0" y1="100.0" x2="459.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="461.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="524.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">링크</text>
  <text x="524.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">코어 라이브러리</text>
  <line x1="590.0" y1="100.0" x2="606.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="608.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="671.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">변환</text>
  <text x="671.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">avr-objcopy → .hex</text>
  <line x1="737.0" y1="100.0" x2="753.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="755.0" y="70.0" width="127.0" height="60.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="818.5" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">업로드</text>
  <text x="818.5" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">avrdude</text>
  <text x="230.0" y="160.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">#include &lt;Arduino.h&gt;</text>
  <text x="230.0" y="178.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">추가</text>
  <text x="230.0" y="196.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">함수 원형 자동 생성</text>
  <text x="377.0" y="160.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">digitalWrite, Serial 등</text>
  <text x="377.0" y="178.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">아두이노 코어와</text>
  <text x="377.0" y="196.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">main() 함수를 함께 링크</text>
  <text x="818.0" y="160.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">보드를 리셋하고</text>
  <text x="818.0" y="178.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">부트로더에</text>
  <text x="818.0" y="196.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">115200 bps로 전송</text>
  <rect x="60.0" y="240.0" width="780.0" height="66.0" rx="8" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="264.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">환경 설정에서 "컴파일과 업로드 중 자세한 출력 표시"를 켜면 실제로 실행되는 명령이 모두 보인다</text>
  <text x="450.0" y="288.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">이 장에서는 같은 일을 avr-gcc, avr-objcopy, avrdude를 직접 실행해서 해 본다</text>
</svg>
