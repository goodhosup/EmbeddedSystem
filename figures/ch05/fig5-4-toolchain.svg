  <rect x="718.0" y="70.0" width="150.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="793.0" y="97.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">objcopy</text>
  <text x="793.0" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">→ .bin · .hex</text>
  <text x="450.0" y="58.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">빌드: PC 안에서 일어나는 일</text>
