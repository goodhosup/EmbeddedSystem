  <line x1="732.0" y1="230.0" x2="766.0" y2="230.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M535,132 L535,165 L205,165 L205,196" stroke="#616e7c" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="370.0" y="160.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">.elf (심볼 포함)</text>
  <path d="M800,132 L800,180 L445,180 L445,196" stroke="#616e7c" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="620.0" y="176.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">.elf 또는 .bin 업로드</text>
  <text x="130.0" y="300.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">arm-none-eabi-gcc</text>
  <text x="300.0" y="300.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">STM32용 크로스 컴파일러, 링커, objcopy 묶음</text>
  <text x="130.0" y="322.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">avr-gcc · avr-libc</text>
  <text x="300.0" y="322.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">AVR용 크로스 컴파일러와 표준 라이브러리</text>
  <text x="130.0" y="344.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">avrdude</text>
  <text x="300.0" y="344.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">AVR 업로드 도구 (부트로더, USBasp 모두 지원)</text>
  <text x="130.0" y="366.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">OpenOCD</text>
  <text x="300.0" y="366.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">디버그 프로브를 GDB와 이어 주는 서버</text>
