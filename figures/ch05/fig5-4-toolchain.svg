  <text x="449.0" y="116.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">ld + 링커 스크립트</text>
  <line x1="526.0" y1="100.0" x2="544.0" y2="100.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
