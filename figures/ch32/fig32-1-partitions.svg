  <text x="490.0" y="75.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">섹터 0~1, 32 KB</text>
  <text x="210.0" y="68.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0800 0000</text>
