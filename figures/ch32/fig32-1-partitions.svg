  <text x="490.0" y="105.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">섹터 2, 16 KB</text>
  <text x="210.0" y="98.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0800 8000</text>
  <rect x="220.0" y="116.0" width="260.0" height="30.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="350.0" y="131.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">부트 상태 1</text>
  <text x="490.0" y="135.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">섹터 3, 16 KB</text>
  <text x="210.0" y="128.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0800 C000</text>
  <rect x="220.0" y="146.0" width="260.0" height="39.7" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
  <text x="350.0" y="165.8" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">(앱 데이터)</text>
  <text x="490.0" y="169.8" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">섹터 4, 64 KB</text>
  <text x="210.0" y="158.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0801 0000</text>
  <rect x="220.0" y="185.7" width="260.0" height="79.4" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.4"/>
  <text x="350.0" y="221.4" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">슬롯 A</text>
  <text x="350.0" y="239.4" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">섹터 5, 128 KB</text>
  <text x="210.0" y="197.7" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0802 0000</text>
  <rect x="220.0" y="265.0" width="260.0" height="79.4" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.4"/>
  <text x="350.0" y="300.7" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">슬롯 B</text>
  <text x="350.0" y="318.7" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">섹터 6, 128 KB</text>
  <text x="210.0" y="277.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0804 0000</text>
  <rect x="220.0" y="344.4" width="260.0" height="79.4" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
  <text x="350.0" y="380.1" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">(비어 있음)</text>
  <text x="350.0" y="398.1" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">섹터 7, 128 KB</text>
  <text x="210.0" y="356.4" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x0806 0000</text>
  <text x="720.0" y="236.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">슬롯 하나의 내부</text>
  <rect x="600.0" y="250.0" width="240.0" height="34.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1.3"/>
  <text x="720.0" y="272.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">머리말 512 B (magic, 크기, 버전, CRC)</text>
  <rect x="600.0" y="284.0" width="240.0" height="40.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.3"/>
  <text x="720.0" y="308.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">벡터 테이블 (+0x200, VTOR)</text>
  <rect x="600.0" y="324.0" width="240.0" height="70.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.3"/>
  <text x="720.0" y="364.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">앱 코드와 상수</text>
  <line x1="482.0" y1="330.0" x2="596.0" y2="268.0" stroke="#334e68" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="450.0" y="470.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">섹터 크기가 고르지 않으므로(16/64/128 KB) 지울 단위를 생각해 나눈다. 부트 상태는 작은 섹터 두 개를 번갈아 쓴다</text>
  <text x="450.0" y="490.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">부트로더 영역은 앱이 지울 수 없게 막고(flash_f4.c), 제품에서는 쓰기 보호(옵션 바이트)도 건다(33장)</text>
</svg>
