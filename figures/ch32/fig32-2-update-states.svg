<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 32-2  업데이트와 롤백 상태 다이어그램</text>
  <rect x="60.0" y="90.0" width="200.0" height="64.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="160.0" y="118.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">A 확정</text>
  <text x="160.0" y="138.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">active = A</text>
  <rect x="350.0" y="90.0" width="200.0" height="64.0" rx="18" fill="#eef1f4" stroke="#334e68" stroke-width="1.6"/>
  <text x="450.0" y="118.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">B 받는 중</text>
  <text x="450.0" y="138.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">B 지우고 쓰기</text>
  <rect x="640.0" y="90.0" width="200.0" height="64.0" rx="18" fill="#fdebd7" stroke="#d9730d" stroke-width="1.6"/>
  <text x="740.0" y="118.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">B 시험 부팅</text>
  <text x="740.0" y="138.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">pending = B, tries 1~3</text>
  <rect x="640.0" y="300.0" width="200.0" height="64.0" rx="18" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="740.0" y="328.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">B 확정</text>
  <text x="740.0" y="348.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">active = B</text>
  <rect x="60.0" y="300.0" width="200.0" height="64.0" rx="18" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.6"/>
  <text x="160.0" y="328.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">A 확정 (롤백)</text>
  <text x="160.0" y="348.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">pending 지움</text>
  <line x1="262.0" y1="122.0" x2="346.0" y2="122.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="304.0" y="112.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">u: 받기 시작</text>
  <line x1="552.0" y1="122.0" x2="636.0" y2="122.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="594.0" y="112.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="bold">CRC 확인 → 리셋</text>
  <path d="M450,156 L450,200 L160,200 L160,158" stroke="#d64545" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="305.0" y="194.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">받다가 끊김, 검증 실패: A 그대로</text>
  <line x1="740.0" y1="156.0" x2="740.0" y2="296.0" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="750.0" y="214.0" font-size="11" text-anchor="start" fill="#2f9e44" font-weight="bold">자가 진단 통과</text>
  <text x="750.0" y="230.0" font-size="11" text-anchor="start" fill="#2f9e44" font-weight="bold">→ c (확정)</text>
  <path d="M640,140 L560,140 L560,250 L300,250 L300,296" stroke="#d9730d" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
