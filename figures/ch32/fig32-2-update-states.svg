  <path d="M840,122 C880,90 880,160 842,140" stroke="#d9730d" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="872.0" y="84.0" font-size="10" text-anchor="middle" fill="#d9730d" font-weight="normal">리셋</text>
  <text x="450.0" y="410.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">핵심 규칙: 새 이미지는 스스로 "잘 된다"고 확정할 때까지 시험 중이다. 확정 전에 몇 번 리셋되면 이전 이미지로 돌아간다</text>
  <text x="450.0" y="432.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">MCUboot의 test/confirm, ESP-IDF의 PENDING_VERIFY → VALID가 같은 생각이다</text>
