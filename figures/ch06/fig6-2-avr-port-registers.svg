  <text x="795.0" y="284.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">입력, 떠 있음 (Hi-Z)</text>
  <rect x="610.0" y="292.0" width="50.0" height="26.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
