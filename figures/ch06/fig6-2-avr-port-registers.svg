  <text x="440.0" y="410.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">PORT는 "내가 쓴 값", PIN은 "핀에서 실제로 읽은 값"이다. 출력 중에도 PIN으로 핀 전압을 읽을 수 있다</text>
