  <text x="530.0" y="334.0" font-size="13" text-anchor="start" fill="#2f6fdf" font-weight="bold">GPIOA_AFRL의 AFRL2 (비트 11:8) = 0111 (7)</text>
  <text x="530.0" y="356.0" font-size="13" text-anchor="start" fill="#2f6fdf" font-weight="bold">그리고 GPIOA_MODER의 MODER2 = 10 (대체 기능)</text>
  <text x="640.0" y="120.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">어떤 핀이 어떤 AF를 가지는지는</text>
  <text x="640.0" y="140.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">데이터시트(DS10314)의</text>
  <text x="640.0" y="160.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">대체 기능 매핑 표에 있다</text>
  <text x="450.0" y="388.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">AF 번호의 의미는 핀마다 다르다. 이 그림의 주변장치 이름은 STM32F411의 일반적인 배정을 단순화한 것이다</text>
