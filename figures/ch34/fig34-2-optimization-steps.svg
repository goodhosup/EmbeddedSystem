<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 34-2  최적화 단계별 실행 시간 비교 (개념도)</text>
  <text x="318.0" y="96.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">① -O0, 16 MHz, float</text>
  <rect x="330.0" y="76.0" width="500.0" height="34.0" rx="3" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="318.0" y="158.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">② -O2 (컴파일러 최적화)</text>
  <rect x="330.0" y="138.0" width="190.0" height="34.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="318.0" y="220.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">③ 100 MHz + Flash 대기 3, ART 끔</text>
  <rect x="330.0" y="200.0" width="80.0" height="34.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="318.0" y="282.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">④ 100 MHz + ART 켬 (프리페치, 캐시)</text>
  <rect x="330.0" y="262.0" width="35.0" height="34.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="318.0" y="344.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">⑤ Q15 + SIMD (SMLALD, 두 탭씩)</text>
  <rect x="330.0" y="324.0" width="20.0" height="34.0" rx="3" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <line x1="330.0" y1="60.0" x2="330.0" y2="380.0" stroke="#334e68" stroke-width="1.4"/>
  <text x="450.0" y="410.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">막대는 상대적인 크기를 보여 주는 개념도다. 실제 값은 예제를 빌드해 34.7절의 표에 직접 채운다</text>
  <text x="450.0" y="432.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">순서가 중요하다: 먼저 재고, 가장 큰 것(알고리즘, 클럭, 메모리 대기)부터. 어셈블리 수준은 마지막에</text>
</svg>
