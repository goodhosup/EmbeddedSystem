  <rect x="442.0" y="80.0" width="44.0" height="44.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.3"/>
  <text x="464.0" y="108.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="normal">2^-8</text>
  <text x="464.0" y="72.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">7</text>
  <rect x="486.0" y="80.0" width="44.0" height="44.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.3"/>
