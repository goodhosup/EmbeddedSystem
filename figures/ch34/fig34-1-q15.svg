  <text x="728.0" y="108.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="normal">2^-14</text>
  <text x="728.0" y="72.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">1</text>
  <rect x="750.0" y="80.0" width="44.0" height="44.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.3"/>
  <text x="772.0" y="108.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="normal">2^-15</text>
  <text x="772.0" y="72.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">0</text>
  <text x="112.0" y="146.0" font-size="11" text-anchor="middle" fill="#d9730d" font-weight="bold">부호</text>
  <text x="464.0" y="146.0" font-size="11" text-anchor="middle" fill="#2f6fdf" font-weight="bold">소수부 15비트 (각 비트의 무게 2^-1 ~ 2^-15)</text>
  <text x="450.0" y="182.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">값 = (int16_t 정수) / 32768      범위 -1.0 ~ +0.99997      분해능 2^-15 ≈ 0.0000305</text>
  <text x="250.0" y="222.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">실수</text>
  <text x="450.0" y="222.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">16진수</text>
  <text x="650.0" y="222.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">정수</text>
  <text x="250.0" y="248.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">0.5</text>
  <text x="450.0" y="248.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="normal">0x4000</text>
  <text x="650.0" y="248.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">16384</text>
  <text x="250.0" y="272.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">0.25</text>
  <text x="450.0" y="272.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="normal">0x2000</text>
  <text x="650.0" y="272.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">8192</text>
  <text x="250.0" y="296.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">-0.5</text>
  <text x="450.0" y="296.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="normal">0xC000</text>
  <text x="650.0" y="296.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">-16384</text>
  <text x="250.0" y="320.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">-1.0</text>
  <text x="450.0" y="320.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="normal">0x8000</text>
  <text x="650.0" y="320.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">-32768</text>
  <text x="250.0" y="344.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">0.99997</text>
  <text x="450.0" y="344.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="normal">0x7FFF</text>
  <text x="650.0" y="344.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">32767</text>
  <text x="450.0" y="384.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">곱셈: Q15 × Q15 = Q30 (32비트) → 반올림하고 15비트 오른쪽으로 → Q15.  -1 × -1 = +1은 표현할 수 없어 포화</text>
  <text x="450.0" y="406.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">덧셈을 여러 번 하면 넘친다: 누산기는 더 넓게(32, 64비트) 두고 마지막에 포화시킨다</text>
</svg>
