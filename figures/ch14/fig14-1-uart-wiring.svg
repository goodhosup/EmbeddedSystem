<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="380.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 14-1  UART 연결: TX와 RX는 서로 엇갈려 연결한다</text>
  <rect x="60.0" y="60.0" width="200.0" height="140.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="160.0" y="127.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">장치 A</text>
  <text x="160.0" y="146.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">예: STM32</text>
  <rect x="500.0" y="60.0" width="200.0" height="140.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="600.0" y="127.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">장치 B</text>
  <text x="600.0" y="146.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">예: GPS 모듈</text>
  <text x="240.0" y="95.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">TX</text>
  <text x="520.0" y="95.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">TX</text>
  <text x="240.0" y="135.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">RX</text>
  <text x="520.0" y="135.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">RX</text>
  <text x="240.0" y="180.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">GND</text>
  <text x="520.0" y="180.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">GND</text>
  <line x1="262.0" y1="90.0" x2="498.0" y2="130.0" stroke="#2f6fdf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="498.0" y1="90.0" x2="262.0" y2="130.0" stroke="#d9730d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="262.0" y1="175.0" x2="498.0" y2="175.0" stroke="#1f2933" stroke-width="2.5"/>
  <text x="380.0" y="165.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">GND 공유 (기준 전압을 맞춘다)</text>
