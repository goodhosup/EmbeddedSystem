<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 14-6  USB–UART 변환기를 통한 PC 연결</text>
  <rect x="30.0" y="110.0" width="150.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="105.0" y="142.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">PC</text>
  <text x="105.0" y="161.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">터미널 프로그램</text>
  <rect x="260.0" y="110.0" width="170.0" height="70.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="345.0" y="142.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">USB–UART 변환 칩</text>
  <text x="345.0" y="161.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">CH340 · CP2102 · FT232</text>
  <rect x="560.0" y="90.0" width="140.0" height="110.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="630.0" y="150.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">MCU</text>
  <line x1="182.0" y1="145.0" x2="256.0" y2="145.0" stroke="#334e68" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="219.0" y="136.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">USB</text>
  <text x="442.0" y="122.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="bold">TX</text>
  <text x="548.0" y="122.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="bold">RX</text>
  <line x1="466.0" y1="118.0" x2="524.0" y2="118.0" stroke="#d9730d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="442.0" y="150.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="bold">RX</text>
  <text x="548.0" y="150.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="bold">TX</text>
  <line x1="466.0" y1="146.0" x2="524.0" y2="146.0" stroke="#2f6fdf" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="442.0" y="178.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="bold">GND</text>
  <text x="548.0" y="178.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="bold">GND</text>
  <line x1="466.0" y1="174.0" x2="524.0" y2="174.0" stroke="#1f2933" stroke-width="2"/>
  <text x="495.0" y="214.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="normal">3.3 V / 5 V 논리 레벨을 맞춘다</text>
  <text x="140.0" y="214.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">PC에서는 가상 COM 포트로 보인다</text>
  <text x="140.0" y="232.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(리눅스 /dev/ttyUSB0, /dev/ttyACM0, 윈도우 COMx)</text>
  <rect x="30.0" y="256.0" width="840.0" height="56.0" rx="8" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="278.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">우노: 보드의 ATmega16U2가 이 역할   ·   NUCLEO: ST-LINK가 USART2(PA2, PA3)를 가상 COM 포트로 연결</text>
  <text x="450.0" y="298.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">그래서 두 보드 모두 USB 케이블 하나로 업로드와 시리얼 통신을 함께 한다</text>
  <rect x="730.0" y="110.0" width="140.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="800.0" y="142.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">센서 · 모듈</text>
  <text x="800.0" y="161.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">GPS 등 (선택)</text>
  <line x1="702.0" y1="145.0" x2="726.0" y2="145.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
