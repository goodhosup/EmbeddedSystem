<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 7-3  벡터 테이블의 구조</text>
  <text x="210.0" y="64.0" font-size="14" text-anchor="middle" fill="#2f9e44" font-weight="bold">(가) ATmega328P: 점프 명령의 목록</text>
  <rect x="110.0" y="80.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="102.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0000</text>
  <text x="225.0" y="102.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP 리셋 처리</text>
  <rect x="110.0" y="114.0" width="230.0" height="34.0" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1"/>
  <text x="100.0" y="136.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0002</text>
  <text x="225.0" y="136.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">JMP INT0_vect</text>
  <rect x="110.0" y="148.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="170.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0004</text>
  <text x="225.0" y="170.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP INT1_vect</text>
  <rect x="110.0" y="182.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="204.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0006</text>
  <text x="225.0" y="204.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP PCINT0_vect</text>
  <rect x="110.0" y="216.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="238.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">…</text>
  <text x="225.0" y="238.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">…</text>
  <rect x="110.0" y="250.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="272.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0020</text>
  <text x="225.0" y="272.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP TIMER0_OVF_vect</text>
  <rect x="110.0" y="284.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="306.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0024</text>
  <text x="225.0" y="306.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP USART_RX_vect</text>
  <rect x="110.0" y="318.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="340.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">…</text>
  <text x="225.0" y="340.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">…</text>
  <rect x="110.0" y="352.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="100.0" y="374.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0032</text>
  <text x="225.0" y="374.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">JMP SPM_READY_vect</text>
  <text x="210.0" y="412.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">Flash 맨 앞, 워드 주소. 벡터 26개, 각각 명령 하나(2워드)</text>
  <text x="210.0" y="430.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">우선순위는 주소가 낮을수록 높다 (고정)</text>
  <text x="660.0" y="64.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">(나) STM32F411: 주소의 목록</text>
  <rect x="560.0" y="80.0" width="230.0" height="30.0" rx="0" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="100.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x000</text>
  <text x="675.0" y="100.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">초기 SP 값</text>
  <rect x="560.0" y="110.0" width="230.0" height="30.0" rx="0" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="130.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x004</text>
  <text x="675.0" y="130.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Reset_Handler</text>
  <rect x="560.0" y="140.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="160.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x008</text>
  <text x="675.0" y="160.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">NMI_Handler</text>
  <rect x="560.0" y="170.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="190.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x00C</text>
  <text x="675.0" y="190.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">HardFault_Handler</text>
  <rect x="560.0" y="200.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="220.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">…</text>
  <text x="675.0" y="220.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">…</text>
  <rect x="560.0" y="230.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="250.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x03C</text>
  <text x="675.0" y="250.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">SysTick_Handler</text>
  <rect x="560.0" y="260.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="280.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x040</text>
  <text x="675.0" y="280.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">IRQ 0: WWDG</text>
  <rect x="560.0" y="290.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="310.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">…</text>
  <text x="675.0" y="310.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">…</text>
  <rect x="560.0" y="320.0" width="230.0" height="30.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <text x="550.0" y="340.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0E0</text>
  <text x="675.0" y="340.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">IRQ 40: EXTI15_10</text>
  <rect x="560.0" y="350.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="370.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">…</text>
  <text x="675.0" y="370.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">…</text>
  <rect x="560.0" y="380.0" width="230.0" height="30.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="550.0" y="400.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x194</text>
  <text x="675.0" y="400.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">IRQ 85: SPI5</text>
  <text x="660.0" y="430.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0x0000 0000(Flash 별칭)부터 4바이트 주소 102개</text>
  <text x="660.0" y="448.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">IRQ n의 위치 = 0x40 + n × 4.  우선순위는 NVIC에서 설정</text>
</svg>
