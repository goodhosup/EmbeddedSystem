<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 7-4  우선순위와 선점: 중첩 인터럽트 타임라인</text>
  <text x="130.0" y="94.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">EXTI ISR</text>
  <text x="130.0" y="110.0" font-size="10" text-anchor="end" fill="#616e7c" font-weight="normal">우선순위 1 (높음)</text>
  <line x1="140.0" y1="116.0" x2="870.0" y2="116.0" stroke="#dde3ea" stroke-width="1"/>
  <text x="130.0" y="174.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">TIM2 ISR</text>
  <text x="130.0" y="190.0" font-size="10" text-anchor="end" fill="#616e7c" font-weight="normal">우선순위 2</text>
  <line x1="140.0" y1="196.0" x2="870.0" y2="196.0" stroke="#dde3ea" stroke-width="1"/>
  <text x="130.0" y="254.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">메인</text>
  <text x="130.0" y="270.0" font-size="10" text-anchor="end" fill="#616e7c" font-weight="normal">스레드 모드</text>
  <line x1="140.0" y1="276.0" x2="870.0" y2="276.0" stroke="#dde3ea" stroke-width="1"/>
  <rect x="150.0" y="240.0" width="102.0" height="30.0" rx="3" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <rect x="626.0" y="240.0" width="204.0" height="30.0" rx="3" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <rect x="252.0" y="160.0" width="102.0" height="30.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <rect x="490.0" y="160.0" width="68.0" height="30.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <rect x="354.0" y="80.0" width="136.0" height="30.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <rect x="558.0" y="160.0" width="68.0" height="30.0" rx="3" fill="#dbe7fb" stroke="#2f6fdf" stroke-width="1"/>
  <text x="592.0" y="180.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="normal">다음</text>
  <line x1="252.0" y1="300.0" x2="252.0" y2="290.0" stroke="#d64545" stroke-width="1.5"/>
  <line x1="354.0" y1="300.0" x2="354.0" y2="290.0" stroke="#d64545" stroke-width="1.5"/>
  <text x="252.0" y="316.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="normal">① TIM2 요청</text>
  <text x="354.0" y="316.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">② EXTI 요청 → 선점</text>
  <text x="422.0" y="100.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">EXTI ISR</text>
  <text x="303.0" y="180.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">TIM2 ISR</text>
  <text x="524.0" y="180.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="normal">이어서</text>
  <text x="150.0" y="346.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">③ EXTI ISR이 실행되는 동안 TIM2 ISR은 멈춘 채 기다린다</text>
  <text x="150.0" y="368.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">④ EXTI ISR이 끝나면 TIM2 ISR이 멈춘 곳부터 이어서 실행된다</text>
  <text x="150.0" y="390.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">⑤ 그사이 들어온 TIM2 요청은 메인으로 돌아가지 않고 바로 이어서 처리된다 (꼬리 물기)</text>
  <text x="450.0" y="428.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">숫자가 작을수록 우선순위가 높다. 더 높은 우선순위만 실행 중인 ISR을 선점할 수 있다</text>
</svg>
