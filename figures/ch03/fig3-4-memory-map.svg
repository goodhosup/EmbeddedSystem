<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="410.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 3-4  Cortex-M 메모리 맵과 STM32F411의 실제 배치</text>
  <rect x="220.0" y="60.0" width="260.0" height="66.0" rx="0" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="91.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">시스템 (코어 주변장치)</text>
  <text x="350.0" y="110.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">NVIC · SysTick · SCB · 디버그</text>
  <text x="208.0" y="122.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0xE000 0000</text>
  <rect x="220.0" y="126.0" width="260.0" height="66.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="157.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">외부 장치</text>
  <text x="350.0" y="176.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">F411에는 사용하지 않음</text>
  <text x="208.0" y="188.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0xA000 0000</text>
  <rect x="220.0" y="192.0" width="260.0" height="66.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="223.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">외부 RAM</text>
  <text x="350.0" y="242.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">F411에는 사용하지 않음</text>
  <text x="208.0" y="254.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x6000 0000</text>
  <rect x="220.0" y="258.0" width="260.0" height="66.0" rx="0" fill="#fdebd7" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="289.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">주변장치</text>
  <text x="350.0" y="308.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">APB1 · APB2 · AHB1 · AHB2</text>
  <text x="208.0" y="320.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x4000 0000</text>
  <rect x="220.0" y="324.0" width="260.0" height="66.0" rx="0" fill="#e3edfd" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="355.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">SRAM</text>
  <text x="350.0" y="374.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">128 KB (0x2000 0000 ~ 0x2001 FFFF)</text>
  <text x="208.0" y="386.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x2000 0000</text>
  <rect x="220.0" y="390.0" width="260.0" height="66.0" rx="0" fill="#e1f4e5" stroke="#334e68" stroke-width="1.5"/>
  <text x="350.0" y="421.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">코드</text>
  <text x="350.0" y="440.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">Flash 512 KB는 0x0800 0000부터</text>
  <text x="208.0" y="452.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0x0000 0000</text>
  <text x="208.0" y="64.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0xFFFF FFFF</text>
  <text x="660.0" y="76.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">주변장치 영역 확대</text>
  <rect x="540.0" y="90.0" width="240.0" height="40.0" rx="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.2"/>
  <text x="552.0" y="115.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x5000 0000</text>
  <text x="670.0" y="108.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">AHB2</text>
  <text x="670.0" y="123.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">USB OTG FS</text>
  <rect x="540.0" y="136.0" width="240.0" height="40.0" rx="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.2"/>
  <text x="552.0" y="161.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x4002 3800</text>
  <text x="670.0" y="154.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">RCC</text>
  <text x="670.0" y="169.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">AHB1</text>
  <rect x="540.0" y="182.0" width="240.0" height="40.0" rx="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.2"/>
  <text x="552.0" y="207.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x4002 0000</text>
  <text x="670.0" y="200.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">GPIOA</text>
  <text x="670.0" y="215.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">AHB1 시작</text>
  <rect x="540.0" y="228.0" width="240.0" height="40.0" rx="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.2"/>
  <text x="552.0" y="253.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x4001 0000</text>
  <text x="670.0" y="246.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">APB2</text>
  <text x="670.0" y="261.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">TIM1, USART1 ...</text>
  <rect x="540.0" y="274.0" width="240.0" height="40.0" rx="4" fill="#ffffff" stroke="#d9730d" stroke-width="1.2"/>
  <text x="552.0" y="299.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x4000 0000</text>
  <text x="670.0" y="292.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">APB1</text>
  <text x="670.0" y="307.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">TIM2, USART2, I2C1 ...</text>
  <path d="M480,324 L530,314" stroke="#d9730d" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M480,258 L530,90" stroke="#d9730d" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <text x="660.0" y="350.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">1장의 0x4002 0014(GPIOA_ODR)는</text>
  <text x="660.0" y="368.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">GPIOA 시작 주소 + 0x14</text>
  <text x="410.0" y="480.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">주소는 아래가 작고 위가 크다. 칸 크기는 실제 비율과 다르다</text>
  <text x="410.0" y="500.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">출처: STM32F411 레퍼런스 매뉴얼(RM0383) 메모리 맵 절, Cortex-M4 프로그래밍 매뉴얼(PM0214)</text>
</svg>
