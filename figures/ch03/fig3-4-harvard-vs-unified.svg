<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 3-4  AVR의 하버드 구조와 Cortex-M의 단일 메모리 맵</text>
  <text x="210.0" y="64.0" font-size="14" text-anchor="middle" fill="#2f9e44" font-weight="bold">(가) AVR: 주소 공간이 둘로 나뉜다</text>
  <rect x="150.0" y="90.0" width="120.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="210.0" y="125.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">CPU</text>
  <rect x="50.0" y="200.0" width="140.0" height="150.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="120.0" y="226.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">프로그램 공간</text>
  <text x="120.0" y="250.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal">Flash</text>
  <text x="120.0" y="276.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0x0000 ~ 0x7FFF</text>
  <text x="120.0" y="294.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(바이트 주소)</text>
  <rect x="230.0" y="200.0" width="140.0" height="150.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="300.0" y="226.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">데이터 공간</text>
  <text x="300.0" y="250.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">레지스터 · I/O · SRAM</text>
  <text x="300.0" y="276.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0x0000 ~ 0x08FF</text>
  <line x1="185.0" y1="152.0" x2="130.0" y2="196.0" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="235.0" y1="152.0" x2="290.0" y2="196.0" stroke="#d9730d" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="118.0" y="178.0" font-size="11" text-anchor="middle" fill="#2f9e44" font-weight="normal">명령 버스</text>
  <text x="305.0" y="178.0" font-size="11" text-anchor="middle" fill="#d9730d" font-weight="normal">데이터 버스</text>
  <text x="210.0" y="378.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="bold">같은 숫자 0x0100도 어느 공간이냐에 따라 다른 곳</text>
  <text x="640.0" y="64.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">(나) Cortex-M: 4 GB 주소 공간 하나</text>
  <rect x="580.0" y="90.0" width="120.0" height="60.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="640.0" y="125.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">CPU</text>
  <rect x="520.0" y="200.0" width="240.0" height="150.0" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <rect x="530.0" y="210.0" width="220.0" height="36.0" rx="4" fill="#e1f4e5" stroke="#334e68" stroke-width="1"/>
  <text x="545.0" y="233.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x0800 0000</text>
  <text x="735.0" y="233.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">Flash</text>
  <rect x="530.0" y="254.0" width="220.0" height="36.0" rx="4" fill="#fdebd7" stroke="#334e68" stroke-width="1"/>
  <text x="545.0" y="277.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x2000 0000</text>
  <text x="735.0" y="277.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">SRAM</text>
  <rect x="530.0" y="298.0" width="220.0" height="36.0" rx="4" fill="#eef1f4" stroke="#334e68" stroke-width="1"/>
  <text x="545.0" y="321.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">0x4000 0000</text>
  <text x="735.0" y="321.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">주변장치</text>
  <line x1="640.0" y1="152.0" x2="640.0" y2="196.0" stroke="#2f6fdf" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="650.0" y="178.0" font-size="11" text-anchor="start" fill="#2f6fdf" font-weight="normal">I-Code · D-Code · 시스템 버스</text>
  <text x="640.0" y="378.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="bold">주소 하나가 곧 장소 하나. 포인터 하나로 어디든 읽는다</text>
</svg>
