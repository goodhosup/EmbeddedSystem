  <text x="450.0" y="340.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">모두가 놓아 두면(꺼짐) 풀업 저항이 1을 만들고, 누구라도 끌어내리면(켜짐) 0이 된다</text>
  <text x="450.0" y="362.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">선 = A AND B AND C (각 장치가 "1을 낸다" = 놓아 둔다).  누가 무엇을 내든 단락은 생기지 않는다</text>
  <text x="450.0" y="384.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">그래서 여러 장치가 같은 선을 쓰고, 보내는 장치가 선을 다시 읽어 충돌(중재 패배)을 알아챌 수 있다</text>
