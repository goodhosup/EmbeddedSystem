<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 15-5  레지스터 쓰기 트랜잭션: 주소, 레지스터 번호, 값</text>
  <rect x="110.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="127.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">S</text>
  <rect x="144.0" y="80.0" width="130.0" height="50.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="209.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">슬레이브 주소</text>
  <rect x="274.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="291.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">W</text>
  <rect x="308.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="325.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="342.0" y="80.0" width="130.0" height="50.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="407.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">레지스터 번호</text>
  <rect x="472.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="489.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="506.0" y="80.0" width="110.0" height="50.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="561.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">값</text>
  <rect x="616.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="633.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="650.0" y="80.0" width="34.0" height="50.0" rx="3" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="667.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">P</text>
  <text x="209.0" y="150.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">7비트</text>
  <text x="407.0" y="150.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">8비트</text>
  <text x="561.0" y="150.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">8비트</text>
  <rect x="110.0" y="180.0" width="18.0" height="18.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="136.0" y="194.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">마스터가 보냄</text>
  <rect x="250.0" y="180.0" width="18.0" height="18.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="276.0" y="194.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">슬레이브가 보냄 (ACK = 0)</text>
  <rect x="470.0" y="180.0" width="18.0" height="18.0" rx="3" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="496.0" y="194.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">버스 조건</text>
  <text x="110.0" y="232.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">예) 센서 0x76의 0xF4번 레지스터(측정 제어)에 0x27을 쓰기 →  S 0x76 W A 0xF4 A 0x27 A P</text>
  <text x="110.0" y="254.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">값을 더 보내면 슬레이브가 레지스터 번호를 1씩 늘려 가며 연속으로 쓰는 장치가 많다 (자동 증가)</text>
</svg>
