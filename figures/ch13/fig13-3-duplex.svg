<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 13-3  단방향, 반이중, 전이중</text>
  <text x="30.0" y="92.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">단방향 (simplex)</text>
  <text x="30.0" y="112.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">한쪽으로만</text>
  <rect x="240.0" y="70.0" width="90.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="285.0" y="103.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="560.0" y="70.0" width="90.0" height="56.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="605.0" y="103.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="332.0" y1="98.0" x2="556.0" y2="98.0" stroke="#2f6fdf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="670.0" y="103.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">GPS 모듈의 위치 출력, 방송</text>
  <text x="30.0" y="178.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">반이중 (half-duplex)</text>
  <text x="30.0" y="198.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">양쪽, 하지만 번갈아</text>
  <rect x="240.0" y="156.0" width="90.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="285.0" y="189.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="560.0" y="156.0" width="90.0" height="56.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="605.0" y="189.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="332.0" y1="184.0" x2="556.0" y2="184.0" stroke="#334e68" stroke-width="2.5"/>
  <polygon points="420.0,174.0 440.0,184.0 420.0,194.0" fill="#2f6fdf" stroke="#2f6fdf" stroke-width="1"/>
  <polygon points="470.0,174.0 450.0,184.0 470.0,194.0" fill="#d9730d" stroke="#d9730d" stroke-width="1"/>
  <text x="444.0" y="170.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">선 하나를 번갈아</text>
  <text x="670.0" y="189.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">I2C, RS-485, 무전기</text>
  <text x="30.0" y="264.0" font-size="14" text-anchor="start" fill="#1f2933" font-weight="bold">전이중 (full-duplex)</text>
  <text x="30.0" y="284.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">양쪽, 동시에</text>
  <rect x="240.0" y="242.0" width="90.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="285.0" y="275.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="560.0" y="242.0" width="90.0" height="56.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="605.0" y="275.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="332.0" y1="260.0" x2="556.0" y2="260.0" stroke="#2f6fdf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="556.0" y1="282.0" x2="332.0" y2="282.0" stroke="#d9730d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="670.0" y="275.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">UART, SPI, 전화</text>
</svg>
