<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 13-5  점대점, 멀티드롭 버스, 데이지 체인 토폴로지</text>
  <text x="150.0" y="70.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">(가) 점대점</text>
  <rect x="50.0" y="130.0" width="70.0" height="50.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="85.0" y="160.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <rect x="180.0" y="130.0" width="70.0" height="50.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="215.0" y="160.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="122.0" y1="155.0" x2="176.0" y2="155.0" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="150.0" y="220.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">UART, SPI(슬레이브 1개), USB</text>
  <text x="150.0" y="240.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">단순하고 주소가 필요 없다</text>
  <text x="450.0" y="70.0" font-size="14" text-anchor="middle" fill="#2f9e44" font-weight="bold">(나) 멀티드롭 버스</text>
  <line x1="330.0" y1="160.0" x2="570.0" y2="160.0" stroke="#334e68" stroke-width="4"/>
  <rect x="340.0" y="92.0" width="46.0" height="40.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="363.0" y="117.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <line x1="363.0" y1="134.0" x2="363.0" y2="158.0" stroke="#334e68" stroke-width="2"/>
  <rect x="402.0" y="92.0" width="46.0" height="40.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="425.0" y="117.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="425.0" y1="134.0" x2="425.0" y2="158.0" stroke="#334e68" stroke-width="2"/>
  <rect x="464.0" y="92.0" width="46.0" height="40.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="487.0" y="117.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">C</text>
  <line x1="487.0" y1="134.0" x2="487.0" y2="158.0" stroke="#334e68" stroke-width="2"/>
  <rect x="526.0" y="92.0" width="46.0" height="40.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="549.0" y="117.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">D</text>
  <line x1="549.0" y1="134.0" x2="549.0" y2="158.0" stroke="#334e68" stroke-width="2"/>
  <text x="450.0" y="220.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">I2C, CAN, RS-485</text>
  <text x="450.0" y="240.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">선은 적지만 주소와 중재가 필요하다</text>
  <text x="750.0" y="70.0" font-size="14" text-anchor="middle" fill="#d9730d" font-weight="bold">(다) 데이지 체인</text>
  <rect x="640.0" y="130.0" width="56.0" height="50.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="668.0" y="160.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">A</text>
  <line x1="698.0" y1="155.0" x2="718.0" y2="155.0" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="720.0" y="130.0" width="56.0" height="50.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="748.0" y="160.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">B</text>
  <line x1="778.0" y1="155.0" x2="798.0" y2="155.0" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="800.0" y="130.0" width="56.0" height="50.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="828.0" y="160.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">C</text>
  <path d="M816,182 L816,200 L668,200 L668,184" stroke="#334e68" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="750.0" y="220.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">SPI 데이지 체인, LED 스트립, JTAG</text>
  <text x="750.0" y="240.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">앞 장치의 출력이 다음 장치의 입력</text>
  <rect x="60.0" y="278.0" width="780.0" height="62.0" rx="8" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="302.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">토폴로지가 정해지면 "누가 말할 차례인가(중재)", "누구에게 하는 말인가(주소)"를 어떻게 풀지가 정해진다</text>
  <text x="450.0" y="324.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">점대점은 둘 다 필요 없고, 버스는 둘 다 필요하며, 데이지 체인은 순서(위치)가 곧 주소다</text>
</svg>
