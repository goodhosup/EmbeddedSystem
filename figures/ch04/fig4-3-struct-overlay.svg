  <line x1="322.0" y1="223.0" x2="462.0" y2="223.0" stroke="#c9d2dc" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="140.0" y="240.0" width="180.0" height="34.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="230.0" y="262.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">32비트</text>
  <text x="130.0" y="262.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">0x4002 0014</text>
  <text x="470.0" y="262.0" font-size="13" text-anchor="start" fill="#2f6fdf" font-weight="bold" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t ODR;     </text>
  <text x="870.0" y="262.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">/* 0x14 */</text>
  <line x1="322.0" y1="257.0" x2="462.0" y2="257.0" stroke="#2f6fdf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140.0" y="274.0" width="180.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="230.0" y="296.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">32비트</text>
  <text x="130.0" y="296.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">0x4002 0018</text>
  <text x="470.0" y="296.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t BSRR;    </text>
  <text x="870.0" y="296.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">/* 0x18 */</text>
  <line x1="322.0" y1="291.0" x2="462.0" y2="291.0" stroke="#c9d2dc" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="140.0" y="308.0" width="180.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
  <text x="230.0" y="330.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">32비트</text>
  <text x="130.0" y="330.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">0x4002 001C</text>
  <text x="470.0" y="330.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t LCKR;    </text>
  <text x="870.0" y="330.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">/* 0x1C */</text>
  <line x1="322.0" y1="325.0" x2="462.0" y2="325.0" stroke="#c9d2dc" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="455.0" y="66.0" width="425.0" height="280.0" rx="8" fill="none" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="140.0" y="382.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">GPIOA = (GPIO_TypeDef *)0x40020000</text>
  <text x="140.0" y="406.0" font-size="13" text-anchor="start" fill="#2f6fdf" font-weight="bold" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">GPIOA-&gt;ODR  →  0x40020000 + 0x14 = 0x40020014</text>
  <text x="450.0" y="425.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">구조체의 시작을 주변장치의 시작 주소에 맞추면, 멤버 하나하나가 레지스터 하나하나에 겹쳐진다</text>
