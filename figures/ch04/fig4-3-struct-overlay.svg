  <text x="230.0" y="160.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">32비트</text>
  <text x="130.0" y="160.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">0x4002 0008</text>
  <text x="470.0" y="160.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t OSPEEDR; </text>
  <text x="870.0" y="160.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">/* 0x08 */</text>
  <line x1="322.0" y1="155.0" x2="462.0" y2="155.0" stroke="#c9d2dc" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="140.0" y="172.0" width="180.0" height="34.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1"/>
