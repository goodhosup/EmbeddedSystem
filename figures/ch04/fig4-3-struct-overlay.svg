  <text x="130.0" y="228.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">0x4002 0010</text>
  <text x="470.0" y="228.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t IDR;     </text>
