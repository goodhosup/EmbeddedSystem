  <text x="470.0" y="194.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">volatile uint32_t PUPDR;   </text>
  <text x="870.0" y="194.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal" xml:space="preserve" font-family="Consolas,'D2Coding','Noto Sans Mono',monospace">/* 0x0C */</text>
  <line x1="322.0" y1="189.0" x2="462.0" y2="189.0" stroke="#c9d2dc" stroke-width="1" stroke-dasharray="4 3"/>
