  <text x="450.0" y="392.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">sample은 hog가 CPU를 독차지해도 정해진 시각에 바로 실행된다. 높은 우선순위가 준비되면 낮은 것은 즉시 밀려난다</text>
