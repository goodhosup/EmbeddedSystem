  <text x="450.0" y="400.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">TMP36: 0 °C에서 500 mV, 1 °C당 10 mV. 출력 가까이에 0.1 µF 커패시터를 달아 잡음을 줄인다</text>
