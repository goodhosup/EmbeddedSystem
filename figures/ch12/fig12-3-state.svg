<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 12-3  동작 상태 다이어그램 (경보 히스테리시스와 표시 단위)</text>
  <ellipse cx="230" cy="150" rx="110" ry="46" fill="#e1f4e5" stroke="#2f9e44" stroke-width="2"/>
  <text x="230.0" y="146.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">정상</text>
  <text x="230.0" y="166.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">경보 LED 꺼짐</text>
  <ellipse cx="670" cy="150" rx="110" ry="46" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
  <text x="670.0" y="146.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">경보</text>
  <text x="670.0" y="166.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">경보 LED 깜빡임</text>
  <path d="M330,128 Q450,80 570,128" stroke="#d64545" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="450.0" y="84.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">온도 ≥ 30.0 °C</text>
  <path d="M570,172 Q450,220 330,172" stroke="#2f9e44" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="450.0" y="228.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="bold">온도 &lt; 29.5 °C</text>
  <text x="450.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(0.5 °C 히스테리시스: 경계에서 깜빡이지 않게)</text>
  <rect x="140.0" y="290.0" width="620.0" height="100.0" rx="10" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="312.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">두 상태 모두에서 버튼 처리 (상태와 독립)</text>
  <rect x="170.0" y="324.0" width="180.0" height="50.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="260.0" y="346.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">짧게 누름</text>
  <text x="260.0" y="365.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">°C ↔ °F 표시 전환</text>
  <rect x="370.0" y="324.0" width="180.0" height="50.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="460.0" y="346.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">1초 이상 누름</text>
  <text x="460.0" y="365.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">최저/최고 기록 초기화</text>
  <rect x="570.0" y="324.0" width="170.0" height="50.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="655.0" y="346.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">1초마다</text>
  <text x="655.0" y="365.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">측정·출력</text>
