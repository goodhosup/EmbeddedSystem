<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 38-2  사용자 프로그램에서 하드웨어까지 호출 경로</text>
  <rect x="200.0" y="56.0" width="500.0" height="44.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.4"/>
  <text x="216.0" y="76.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">사용자 프로그램</text>
  <text x="216.0" y="93.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">cat /sys/bus/iio/devices/iio:device0/in_temp_input</text>
  <line x1="450.0" y1="102.0" x2="450.0" y2="110.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="110.0" width="500.0" height="44.0" rx="6" fill="#eef1f4" stroke="#334e68" stroke-width="1.4"/>
  <text x="216.0" y="130.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">시스템 호출</text>
  <text x="216.0" y="147.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">open(), read()</text>
  <line x1="450.0" y1="156.0" x2="450.0" y2="164.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="164.0" width="500.0" height="44.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="216.0" y="184.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">VFS + sysfs</text>
  <text x="216.0" y="201.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">파일 이름 → 속성 읽기 함수</text>
  <line x1="450.0" y1="210.0" x2="450.0" y2="218.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="218.0" width="500.0" height="44.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="216.0" y="238.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">IIO 서브시스템</text>
  <text x="216.0" y="255.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">in_temp_input → read_raw(IIO_CHAN_INFO_PROCESSED)</text>
  <line x1="450.0" y1="264.0" x2="450.0" y2="272.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="272.0" width="500.0" height="44.0" rx="6" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.4"/>
  <text x="216.0" y="292.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">우리 드라이버 (ch38_bmp280)</text>
  <text x="216.0" y="309.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">read_temp_milli(): 보정 계산</text>
  <line x1="450.0" y1="318.0" x2="450.0" y2="326.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="326.0" width="500.0" height="44.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="216.0" y="346.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">I2C 코어</text>
  <text x="216.0" y="363.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">i2c_smbus_read_i2c_block_data()</text>
  <line x1="450.0" y1="372.0" x2="450.0" y2="380.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="380.0" width="500.0" height="44.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="216.0" y="400.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">I2C 어댑터 드라이버</text>
  <text x="216.0" y="417.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">i2c-designware: 레지스터, 인터럽트</text>
  <line x1="450.0" y1="426.0" x2="450.0" y2="434.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="200.0" y="434.0" width="500.0" height="44.0" rx="6" fill="#eef1f4" stroke="#334e68" stroke-width="1.4"/>
  <text x="216.0" y="454.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">하드웨어</text>
  <text x="216.0" y="471.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">RP1의 I2C 컨트롤러 → SDA/SCL → BMP280</text>
  <text x="186.0" y="78.0" font-size="11" text-anchor="end" fill="#2f6fdf" font-weight="bold">사용자 공간</text>
  <line x1="190.0" y1="106.0" x2="710.0" y2="106.0" stroke="#d64545" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="186.0" y="140.0" font-size="11" text-anchor="end" fill="#d9730d" font-weight="bold">커널 공간</text>
  <text x="720.0" y="300.0" font-size="11" text-anchor="start" fill="#2f9e44" font-weight="bold">← 우리가 쓰는 부분은</text>
  <text x="720.0" y="318.0" font-size="11" text-anchor="start" fill="#2f9e44" font-weight="bold">   이 한 칸뿐</text>
  <text x="450.0" y="506.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">결과 "24870"(밀리도)이 같은 길을 거꾸로 올라간다. 위아래 계층은 커널이 이미 갖추고 있다</text>
</svg>
