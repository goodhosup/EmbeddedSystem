<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 40-1  시스템 전체 구성도</text>
  <rect x="40.0" y="150.0" width="160.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="120.0" y="182.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">BMP280</text>
  <text x="120.0" y="201.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">I2C (15장)</text>
  <rect x="240.0" y="110.0" width="210.0" height="150.0" rx="10" fill="#e3edfd" stroke="#2f6fdf" stroke-width="2"/>
  <text x="345.0" y="138.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">STM32 센서 노드</text>
  <text x="345.0" y="166.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">보안 부트로더 (32·33장)</text>
  <text x="345.0" y="190.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">슬롯 A / B</text>
  <text x="345.0" y="214.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">측정, OTA 쓰기, 워치독</text>
  <line x1="202.0" y1="185.0" x2="236.0" y2="185.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="500.0" y="110.0" width="190.0" height="150.0" rx="10" fill="#fdebd7" stroke="#d9730d" stroke-width="2"/>
  <text x="595.0" y="138.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">ESP32 연결부</text>
  <text x="595.0" y="166.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">Wi-Fi (19장)</text>
  <text x="595.0" y="190.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">MQTT / TLS (20장)</text>
  <text x="595.0" y="214.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">이미지 받아 전달</text>
  <line x1="452.0" y1="170.0" x2="496.0" y2="170.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="474.0" y="160.0" font-size="10" text-anchor="middle" fill="#1f2933" font-weight="bold">UART</text>
  <text x="474.0" y="200.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">COBS</text>
  <text x="474.0" y="214.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">CRC</text>
  <text x="474.0" y="228.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">ARQ</text>
  <rect x="730.0" y="70.0" width="140.0" height="110.0" rx="10" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="800.0" y="98.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">클라우드</text>
  <text x="800.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">MQTT 브로커</text>
  <text x="800.0" y="142.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">업데이트 서버</text>
  <text x="800.0" y="162.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(HTTPS)</text>
  <line x1="692.0" y1="160.0" x2="726.0" y2="140.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="730.0" y="220.0" width="140.0" height="60.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="800.0" y="247.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">빌드 서버</text>
  <text x="800.0" y="266.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">CI + 서명 (36장)</text>
  <line x1="800.0" y1="218.0" x2="800.0" y2="182.0" stroke="#334e68" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="450.0" y="320.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="bold">신뢰 경계: 서명 확인은 STM32 노드가 한다. ESP32와 네트워크는 믿지 않는다</text>
  <line x1="470.0" y1="100.0" x2="470.0" y2="280.0" stroke="#d64545" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="450.0" y="360.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">측정값: BMP280 → 노드 → (UART) → 연결부 → (MQTT/TLS) → 브로커</text>
  <text x="450.0" y="384.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">업데이트: 빌드 서버(서명) → 업데이트 서버 → (HTTPS) → 연결부 → (UART) → 노드(서명 확인) → 시험 부팅</text>
  <text x="450.0" y="418.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">37.1절의 "리눅스/통신 칩 + MCU" 구조: 통신은 ESP32가, 측정과 안전은 STM32가 맡는다</text>
</svg>
