<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 40-3  배포와 업데이트 흐름</text>
  <rect x="30.0" y="70.0" width="196.0" height="70.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="128.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">1. 태그 v1.1.0</text>
  <text x="128.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">CI: 테스트, 빌드 (36장)</text>
  <line x1="228.0" y1="105.0" x2="242.0" y2="105.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="244.0" y="70.0" width="196.0" height="70.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="342.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">2. 서명</text>
  <text x="342.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">보안 카운터 포함 (33장)</text>
  <line x1="442.0" y1="105.0" x2="456.0" y2="105.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="458.0" y="70.0" width="196.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="556.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">3. 서버에 올림</text>
  <text x="556.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">HTTPS URL</text>
  <line x1="656.0" y1="105.0" x2="670.0" y2="105.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="672.0" y="70.0" width="196.0" height="70.0" rx="8" fill="#eef1f4" stroke="#334e68" stroke-width="1.5"/>
  <text x="770.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">4. MQTT 명령</text>
  <text x="770.0" y="122.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">nodes/&lt;id&gt;/ota</text>
  <rect x="30.0" y="200.0" width="196.0" height="70.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="128.0" y="230.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">5. 연결부가 받아 전달</text>
  <text x="128.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">UART, ARQ</text>
  <line x1="228.0" y1="235.0" x2="242.0" y2="235.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="244.0" y="200.0" width="196.0" height="70.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="342.0" y="230.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">6. 노드가 쓰고 서명 확인</text>
  <text x="342.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">다른 슬롯</text>
  <line x1="442.0" y1="235.0" x2="456.0" y2="235.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="458.0" y="200.0" width="196.0" height="70.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="556.0" y="230.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">7. 시험 부팅</text>
  <text x="556.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">tries ≤ 3</text>
  <line x1="656.0" y1="235.0" x2="670.0" y2="235.0" stroke="#334e68" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="672.0" y="200.0" width="196.0" height="70.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="770.0" y="230.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">8. 자가 진단 → 확정</text>
  <text x="770.0" y="252.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">또는 롤백 (32장)</text>
  <path d="M840,142 L840,170 L128,170 L128,198" stroke="#334e68" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="450.0" y="316.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">단계적 배포: 먼저 시험 장치 몇 대 → 문제가 없으면 1% → 10% → 전체</text>
  <text x="450.0" y="340.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">각 단계에서 텔레메트리의 "ota": "accepted"와 확정 후 버전, 크래시 기록(36장)을 확인하고 이상하면 멈춘다</text>
  <rect x="120.0" y="368.0" width="660.0" height="70.0" rx="8" fill="#fff5f5" stroke="#d64545" stroke-width="1.2"/>
  <text x="450.0" y="394.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="bold">실패해도 안전한 이유</text>
  <text x="450.0" y="416.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">받다가 끊김 → 기존 슬롯 그대로 / 서명 틀림 → 시험 요청 안 함 / 새 이미지 멈춤 → 워치독 + 롤백</text>
</svg>
