  <path d="M700.0,120.0 L708.0,123.3 L692.0,130.0 L708.0,136.7 L692.0,143.3 L708.0,150.0 L692.0,156.7 L700.0,160.0" stroke="#334e68" stroke-width="2" fill="none" stroke-linejoin="round"/>
