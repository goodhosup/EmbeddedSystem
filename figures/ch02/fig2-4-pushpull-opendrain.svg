  <text x="730.0" y="230.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">출력 = 1</text>
  <text x="610.0" y="350.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">0: 트랜지스터가 켜져 GND로 끌어내림</text>
  <text x="610.0" y="370.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">1: 트랜지스터가 꺼지고 풀업 저항이 끌어올림</text>
  <text x="610.0" y="390.0" font-size="12" text-anchor="middle" fill="#2f9e44" font-weight="bold">여러 출력을 한 선에 묶어도 안전 (I2C)</text>
