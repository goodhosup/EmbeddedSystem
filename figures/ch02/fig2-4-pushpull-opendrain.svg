  <text x="210.0" y="64.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">(가) 푸시풀: 1과 0을 모두 힘 있게 낸다</text>
  <line x1="136.0" y1="100.0" x2="164.0" y2="100.0" stroke="#334e68" stroke-width="2.5"/>
