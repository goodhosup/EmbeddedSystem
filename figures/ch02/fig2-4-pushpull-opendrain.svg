  <text x="150.0" y="370.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">출력 0: 아래가 켜져 GND로 끌어내림</text>
  <text x="150.0" y="390.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="bold">두 출력을 서로 연결하면 단락 위험</text>
