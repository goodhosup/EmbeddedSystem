<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="410.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 2-2  논리 레벨과 노이즈 마진 (ATmega328P, VCC = 5 V 기준)</text>
  <line x1="70.0" y1="360.0" x2="70.0" y2="63.2" stroke="#616e7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="64.0" y1="360.0" x2="70.0" y2="360.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="364.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0 V</text>
  <line x1="64.0" y1="304.0" x2="70.0" y2="304.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="308.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">1 V</text>
  <line x1="64.0" y1="248.0" x2="70.0" y2="248.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="252.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">2 V</text>
  <line x1="64.0" y1="192.0" x2="70.0" y2="192.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="196.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">3 V</text>
  <line x1="64.0" y1="136.0" x2="70.0" y2="136.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="140.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">4 V</text>
  <line x1="64.0" y1="80.0" x2="70.0" y2="80.0" stroke="#616e7c" stroke-width="1.5"/>
  <text x="58.0" y="84.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">5 V</text>
  <text x="260.0" y="62.0" font-size="13" text-anchor="middle" fill="#2f6fdf" font-weight="bold">출력이 보장하는 값</text>
  <rect x="200.0" y="80.0" width="120.0" height="44.8" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="260.0" y="107.4" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">High 출력</text>
  <rect x="200.0" y="309.6" width="120.0" height="50.4" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="260.0" y="339.8" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">Low 출력</text>
  <text x="194.0" y="128.8" font-size="11" text-anchor="end" fill="#2f6fdf" font-weight="normal">VOH min 4.2 V</text>
  <text x="194.0" y="313.6" font-size="11" text-anchor="end" fill="#2f6fdf" font-weight="normal">VOL max 0.9 V</text>
  <text x="580.0" y="62.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">입력이 받아들이는 값</text>
  <rect x="520.0" y="80.0" width="120.0" height="112.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="580.0" y="141.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">High로 인식</text>
  <rect x="520.0" y="192.0" width="120.0" height="84.0" rx="3" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
  <text x="580.0" y="230.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">정의되지 않음</text>
  <text x="580.0" y="248.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="normal">(피해야 하는 구간)</text>
  <rect x="520.0" y="276.0" width="120.0" height="84.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="580.0" y="323.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">Low로 인식</text>
  <text x="646.0" y="196.0" font-size="11" text-anchor="start" fill="#d9730d" font-weight="normal">VIH min 3.0 V</text>
  <text x="646.0" y="280.0" font-size="11" text-anchor="start" fill="#d9730d" font-weight="normal">VIL max 1.5 V</text>
  <line x1="330.0" y1="124.8" x2="510.0" y2="124.8" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="330.0" y1="192.0" x2="510.0" y2="192.0" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="360.0" y1="125.8" x2="360.0" y2="191.0" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="372.0" y="163.4" font-size="12" text-anchor="start" fill="#2f9e44" font-weight="bold">High 노이즈 마진 1.2 V</text>
  <line x1="330.0" y1="276.0" x2="510.0" y2="276.0" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="330.0" y1="309.6" x2="510.0" y2="309.6" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="360.0" y1="277.0" x2="360.0" y2="308.6" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="372.0" y="297.8" font-size="12" text-anchor="start" fill="#2f9e44" font-weight="bold">Low 노이즈 마진 0.6 V</text>
  <text x="410.0" y="400.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">출력의 최악값과 입력의 경계 사이 여유(노이즈 마진)만큼 잡음을 견딜 수 있다</text>
</svg>
