  <text x="430.0" y="418.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">값은 ATmega328P 데이터시트의 DC 특성 표를 단순화한 것이다. 실제 설계에는 원본 표를 확인한다.</text>
