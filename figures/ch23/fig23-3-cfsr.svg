<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 23-3  CFSR 레지스터 비트 해석표 (0xE000 ED28)</text>
  <rect x="40.0" y="56.0" width="820.0" height="28.0" rx="4" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="56.0" y="75.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">UFSR: 사용 폴트 (비트 31:16)</text>
  <text x="80.0" y="103.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">25</text>
  <text x="100.0" y="103.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">DIVBYZERO</text>
  <text x="260.0" y="103.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">0으로 나눔 (CCR.DIV_0_TRP = 1일 때)</text>
  <text x="80.0" y="125.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">24</text>
  <text x="100.0" y="125.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">UNALIGNED</text>
  <text x="260.0" y="125.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">정렬되지 않은 접근 (UNALIGN_TRP = 1일 때)</text>
  <text x="80.0" y="147.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">19</text>
  <text x="100.0" y="147.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">NOCP</text>
  <text x="260.0" y="147.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">보조 프로세서 없음: FPU를 켜지 않고 float 명령</text>
  <text x="80.0" y="169.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">18</text>
  <text x="100.0" y="169.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">INVPC</text>
  <text x="260.0" y="169.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">잘못된 예외 복귀</text>
  <text x="80.0" y="191.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">17</text>
  <text x="100.0" y="191.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">INVSTATE</text>
  <text x="260.0" y="191.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">Thumb 비트가 0인 주소로 점프</text>
  <text x="80.0" y="213.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">16</text>
  <text x="100.0" y="213.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">UNDEFINSTR</text>
  <text x="260.0" y="213.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">정의되지 않은 명령</text>
  <rect x="40.0" y="230.0" width="820.0" height="28.0" rx="4" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="56.0" y="249.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">BFSR: 버스 폴트 (비트 15:8)</text>
  <text x="80.0" y="277.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">15</text>
  <text x="100.0" y="277.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">BFARVALID</text>
  <text x="260.0" y="277.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">BFAR에 문제 주소가 들어 있음</text>
  <text x="80.0" y="299.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">12</text>
  <text x="100.0" y="299.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">STKERR</text>
  <text x="260.0" y="299.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">예외 진입 중 스택 쓰기 실패</text>
  <text x="80.0" y="321.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">10</text>
  <text x="100.0" y="321.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">IMPRECISERR</text>
  <text x="260.0" y="321.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">부정확: 쓰기 버퍼 때문에 PC가 정확하지 않음</text>
  <text x="80.0" y="343.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">9</text>
  <text x="100.0" y="343.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">PRECISERR</text>
  <text x="260.0" y="343.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">정확: 그 명령이 원인</text>
  <text x="80.0" y="365.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">8</text>
  <text x="100.0" y="365.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">IBUSERR</text>
  <text x="260.0" y="365.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">명령을 가져오다 버스 오류</text>
  <rect x="40.0" y="382.0" width="820.0" height="28.0" rx="4" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="56.0" y="401.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="bold">MMFSR: 메모리 관리 폴트 (비트 7:0)</text>
  <text x="80.0" y="429.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">7</text>
  <text x="100.0" y="429.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">MMARVALID</text>
  <text x="260.0" y="429.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">MMFAR에 문제 주소가 들어 있음</text>
  <text x="80.0" y="451.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">1</text>
  <text x="100.0" y="451.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">DACCVIOL</text>
  <text x="260.0" y="451.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">MPU가 금지한 데이터 접근</text>
  <text x="80.0" y="473.0" font-size="12" text-anchor="end" fill="#616e7c" font-weight="normal">0</text>
  <text x="100.0" y="473.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="bold">IACCVIOL</text>
  <text x="260.0" y="473.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">실행 금지 영역에서 명령 실행</text>
  <text x="450.0" y="496.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">HFSR(0xE000 ED2C)의 FORCED 비트가 1이면 위의 폴트가 HardFault로 올라온 것이다. 원인은 CFSR에서 찾는다</text>
  <text x="450.0" y="512.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">출처: Cortex-M4 프로그래밍 매뉴얼(PM0214) 4.4절 System control block</text>
</svg>
