  <text x="200.0" y="318.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">1 KB 두 개(F, G)를 받는다: 빈 공간이 1 KB 조각으로 갈라진다</text>
  <text x="184.0" y="379.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">④ 큰 할당</text>
