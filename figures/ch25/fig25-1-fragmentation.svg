  <text x="200.0" y="222.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">A, C, E를 돌려준다: 빈 공간 합계 8 KB</text>
  <text x="184.0" y="283.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">③ 작은 할당</text>
