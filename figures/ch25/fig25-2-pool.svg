  <text x="450.0" y="96.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">같은 크기(예: 24 B) 블록 N개를 정적 배열로 미리 잡아 둔다</text>
  <rect x="20.0" y="270.0" width="120.0" height="46.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="80.0" y="298.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">free_list</text>
  <path d="M140,293 L615,293 L615,208" stroke="#2f6fdf" stroke-width="1.8" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M580,146 C560,110 525,110 505,146" stroke="#2f6fdf" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
