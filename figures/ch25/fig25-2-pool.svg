  <rect x="670.0" y="150.0" width="110.0" height="54.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="725.0" y="174.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">블록 5</text>
