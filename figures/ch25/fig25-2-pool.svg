  <text x="450.0" y="346.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">빈 블록의 첫 워드에 다음 빈 블록의 주소를 적어 사슬로 잇는다 (추가 메모리 0)</text>
  <text x="450.0" y="372.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">할당: 사슬 맨 앞 블록을 떼어 준다   해제: 돌려받은 블록을 맨 앞에 붙인다</text>
  <text x="450.0" y="398.0" font-size="12" text-anchor="middle" fill="#2f9e44" font-weight="bold">둘 다 O(1), 크기가 모두 같으므로 단편화가 생기지 않는다</text>
