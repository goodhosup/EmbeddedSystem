<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 21-4  스택과 힙이 마주 보며 자라는 모습</text>
  <rect x="320.0" y="60.0" width="260.0" height="320.0" rx="0" fill="#ffffff" stroke="#334e68" stroke-width="1.5"/>
  <rect x="320.0" y="300.0" width="260.0" height="80.0" rx="0" fill="#e3edfd" stroke="#334e68" stroke-width="1"/>
  <text x="450.0" y="345.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">.data + .bss</text>
  <rect x="320.0" y="230.0" width="260.0" height="70.0" rx="0" fill="#e1f4e5" stroke="#334e68" stroke-width="1"/>
  <text x="450.0" y="270.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">힙 (malloc)</text>
  <line x1="450.0" y1="228.0" x2="450.0" y2="200.0" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="320.0" y="60.0" width="260.0" height="90.0" rx="0" fill="#efe6fb" stroke="#334e68" stroke-width="1"/>
  <text x="450.0" y="110.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">스택</text>
  <line x1="450.0" y1="152.0" x2="450.0" y2="182.0" stroke="#7048e8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450.0" y="194.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">빈 공간</text>
  <text x="310.0" y="64.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x2002 0000 (_estack): 초기 SP</text>
  <text x="310.0" y="384.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">0x2000 0000</text>
  <text x="594.0" y="120.0" font-size="12" text-anchor="start" fill="#7048e8" font-weight="normal">함수를 부를 때마다 아래로 자란다</text>
  <text x="594.0" y="140.0" font-size="11" text-anchor="start" fill="#616e7c" font-weight="normal">(복귀 주소, 지역 변수, 저장된 레지스터)</text>
  <text x="594.0" y="260.0" font-size="12" text-anchor="start" fill="#2f9e44" font-weight="normal">malloc을 부를 때마다 위로 자란다</text>
  <rect x="60.0" y="180.0" width="220.0" height="50.0" rx="6" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
  <text x="170.0" y="202.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">둘이 만나면?</text>
  <text x="170.0" y="220.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="normal">경고 없이 서로를 덮어쓴다</text>
  <text x="450.0" y="408.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">MCU에는 이것을 막아 주는 운영체제가 없다. 크기를 계산하고 감시하는 방법은 25장에서 다룬다</text>
</svg>
