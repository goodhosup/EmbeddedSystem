<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 21-3  .data 복사와 .bss 초기화</text>
  <text x="450.0" y="62.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">uint32_t count = 7;   uint8_t buf[4] = {1, 2, 3, 4};   uint32_t total;   static uint8_t flags[4];</text>
  <text x="160.0" y="98.0" font-size="12" text-anchor="middle" fill="#2f9e44" font-weight="bold">Flash (.data 초기값)</text>
  <rect x="60.0" y="110.0" width="200.0" height="30.0" rx="2" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <text x="160.0" y="130.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">07 00 00 00</text>
  <rect x="60.0" y="144.0" width="200.0" height="30.0" rx="2" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <text x="160.0" y="164.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">01 02 03 04</text>
  <text x="640.0" y="98.0" font-size="12" text-anchor="middle" fill="#2f6fdf" font-weight="bold">SRAM</text>
  <rect x="560.0" y="110.0" width="200.0" height="30.0" rx="2" fill="#fdebd7" stroke="#334e68" stroke-width="1"/>
  <text x="660.0" y="130.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">07 00 00 00</text>
  <text x="770.0" y="130.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">count</text>
  <rect x="560.0" y="144.0" width="200.0" height="30.0" rx="2" fill="#fdebd7" stroke="#334e68" stroke-width="1"/>
  <text x="660.0" y="164.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">01 02 03 04</text>
  <text x="770.0" y="164.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">buf</text>
  <rect x="560.0" y="178.0" width="200.0" height="30.0" rx="2" fill="#e3edfd" stroke="#334e68" stroke-width="1"/>
  <text x="660.0" y="198.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">00 00 00 00</text>
  <text x="770.0" y="198.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">total</text>
  <rect x="560.0" y="212.0" width="200.0" height="30.0" rx="2" fill="#e3edfd" stroke="#334e68" stroke-width="1"/>
  <text x="660.0" y="232.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">00 00 00 00</text>
  <text x="770.0" y="232.0" font-size="12" text-anchor="start" fill="#616e7c" font-weight="normal">flags</text>
  <line x1="262.0" y1="125.0" x2="556.0" y2="125.0" stroke="#d9730d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="262.0" y1="159.0" x2="556.0" y2="159.0" stroke="#d9730d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410.0" y="118.0" font-size="11" text-anchor="middle" fill="#d9730d" font-weight="bold">복사</text>
  <rect x="330.0" y="186.0" width="160.0" height="50.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="410.0" y="216.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">0으로 채우기</text>
  <line x1="492.0" y1="211.0" x2="556.0" y2="193.0" stroke="#2f6fdf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="492.0" y1="211.0" x2="556.0" y2="227.0" stroke="#2f6fdf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="282.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">초기값이 있는 전역 변수(.data)는 값을 Flash에 저장해 두었다가 복사하고, 없는 것(.bss)은 Flash에 아무것도 저장하지 않고 0으로 채운다</text>
  <text x="450.0" y="302.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">그래서 큰 배열을 0으로 초기화할 때는 "= {0}"을 써도 .bss로 가서 Flash를 차지하지 않는다</text>
</svg>
