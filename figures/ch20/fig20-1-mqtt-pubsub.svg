<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 20-1  MQTT 브로커와 발행/구독 구조</text>
  <rect x="360.0" y="150.0" width="180.0" height="90.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="450.0" y="192.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">브로커</text>
  <text x="450.0" y="211.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">Mosquitto, 클라우드 서비스</text>
  <rect x="30.0" y="70.0" width="150.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="105.0" y="103.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">거실 센서</text>
  <text x="105.0" y="142.0" font-size="10" text-anchor="middle" fill="#2f6fdf" font-weight="normal">발행: home/living/temp</text>
  <line x1="182.0" y1="98.0" x2="356.0" y2="195.0" stroke="#2f6fdf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="30.0" y="180.0" width="150.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="105.0" y="213.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">방 센서</text>
  <text x="105.0" y="252.0" font-size="10" text-anchor="middle" fill="#2f6fdf" font-weight="normal">발행: home/room/temp</text>
  <line x1="182.0" y1="208.0" x2="356.0" y2="195.0" stroke="#2f6fdf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="30.0" y="290.0" width="150.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="105.0" y="323.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">ESP32</text>
  <text x="105.0" y="362.0" font-size="10" text-anchor="middle" fill="#2f6fdf" font-weight="normal">발행: home/esp32/status</text>
  <line x1="182.0" y1="318.0" x2="356.0" y2="195.0" stroke="#2f6fdf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="720.0" y="70.0" width="150.0" height="56.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="795.0" y="103.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">대시보드</text>
  <text x="795.0" y="142.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="normal">구독: home/+/temp</text>
  <line x1="542.0" y1="195.0" x2="716.0" y2="98.0" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="720.0" y="180.0" width="150.0" height="56.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="795.0" y="213.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">스마트폰 앱</text>
  <text x="795.0" y="252.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="normal">구독: home/#</text>
  <line x1="542.0" y1="195.0" x2="716.0" y2="208.0" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="720.0" y="290.0" width="150.0" height="56.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="795.0" y="323.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold">기록 서버</text>
  <text x="795.0" y="362.0" font-size="10" text-anchor="middle" fill="#2f9e44" font-weight="normal">구독: home/living/temp</text>
  <line x1="542.0" y1="195.0" x2="716.0" y2="318.0" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="270.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">발행자와 구독자는 서로를 모른다. 브로커가 토픽으로 연결해 준다</text>
  <text x="450.0" y="380.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">와일드카드: +는 한 단계(home/+/temp), #은 그 아래 전부(home/#)</text>
  <text x="450.0" y="400.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">장치는 브로커에 TCP 연결을 하나만 유지하면 되고, 받는 쪽이 늘어도 장치의 코드는 그대로다</text>
</svg>
