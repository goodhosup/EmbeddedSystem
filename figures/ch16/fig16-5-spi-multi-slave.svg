  <text x="640.0" y="325.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">앞 장치의 출력이 다음 장치의 입력. CS 하나로 길게 밀어 넣는다 (LED 드라이버 등)</text>
