  <text x="410.0" y="225.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="normal">클럭 한 번에 한 비트씩 양쪽이 동시에 밀려난다. 8클럭 뒤면 두 레지스터의 내용이 서로 바뀐다.</text>
  <text x="410.0" y="250.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">그래서 SPI는 항상 전이중이다. 읽기만 하고 싶어도 아무 값(보통 0xFF)이라도 보내야 한다.</text>
