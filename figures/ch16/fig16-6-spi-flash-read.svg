<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 16-6  SPI 플래시 읽기 명령 시퀀스 (Read Data, 0x03)</text>
  <text x="105.0" y="104.0" font-size="13" text-anchor="end" fill="#2f6fdf" font-weight="bold">MOSI</text>
  <text x="105.0" y="164.0" font-size="13" text-anchor="end" fill="#d9730d" font-weight="bold">MISO</text>
  <text x="105.0" y="64.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">CS</text>
  <path d="M70,50 L120,50 L120,72 L850,72 L850,50 L890,50" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <rect x="120.0" y="85.0" width="110.0" height="34.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="175.0" y="107.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">명령 0x03</text>
  <rect x="120.0" y="145.0" width="110.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="175.0" y="167.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(무시)</text>
  <rect x="230.0" y="85.0" width="100.0" height="34.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="280.0" y="107.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">주소 [23:16]</text>
  <rect x="230.0" y="145.0" width="100.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="280.0" y="167.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(무시)</text>
  <rect x="330.0" y="85.0" width="100.0" height="34.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="380.0" y="107.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">주소 [15:8]</text>
  <rect x="330.0" y="145.0" width="100.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="380.0" y="167.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(무시)</text>
  <rect x="430.0" y="85.0" width="100.0" height="34.0" rx="3" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="480.0" y="107.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">주소 [7:0]</text>
  <rect x="430.0" y="145.0" width="100.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="480.0" y="167.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">(무시)</text>
  <rect x="530.0" y="85.0" width="90.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="575.0" y="107.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0xFF</text>
  <rect x="530.0" y="145.0" width="90.0" height="34.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="575.0" y="167.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">데이터 0</text>
  <rect x="620.0" y="85.0" width="90.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="665.0" y="107.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0xFF</text>
  <rect x="620.0" y="145.0" width="90.0" height="34.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="665.0" y="167.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">데이터 1</text>
  <rect x="710.0" y="85.0" width="50.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="735.0" y="107.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">…</text>
  <rect x="710.0" y="145.0" width="50.0" height="34.0" rx="3" fill="#ffffff" stroke="#616e7c" stroke-width="1.5"/>
  <text x="735.0" y="167.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">…</text>
  <rect x="760.0" y="85.0" width="90.0" height="34.0" rx="3" fill="#ffffff" stroke="#dde3ea" stroke-width="1"/>
  <text x="805.0" y="107.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">0xFF</text>
  <rect x="760.0" y="145.0" width="90.0" height="34.0" rx="3" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="805.0" y="167.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">데이터 N</text>
  <text x="450.0" y="214.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">CS를 Low로 내리고 명령과 24비트 주소를 보낸 뒤, 계속 클럭을 주면 플래시가 주소를 늘려 가며 데이터를 내보낸다</text>
  <text x="450.0" y="236.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">읽기는 원하는 만큼 이어서 할 수 있다. CS를 High로 올리는 순간 명령이 끝난다</text>
  <rect x="120.0" y="262.0" width="660.0" height="60.0" rx="8" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="284.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">쓰기(Page Program, 0x02)는 그 전에 Write Enable(0x06)이 필요하고, 한 번에 한 페이지(256바이트) 안에서만 된다</text>
  <text x="450.0" y="306.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">지우기(0x20 = 4 KB 섹터)는 모든 비트를 1(0xFF)로 만든다. 쓰기는 1 → 0만 할 수 있다</text>
</svg>
