  <text x="170.0" y="378.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">현장에서 돌아온 장치를 추적</text>
  <text x="600.0" y="340.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">시험 시간이 곧 생산 비용이다: 몇 초 안에 끝나도록 설계한다</text>
  <text x="600.0" y="362.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">보드 설계 단계에서 테스트 포인트와 SWD 핀을 남겨 둔다 (23장)</text>
  <text x="600.0" y="384.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">통과한 장치에만 일련번호와 키를 넣고, 마지막에 디버그 포트를 잠근다 (33장)</text>
