  <text x="450.0" y="260.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">꼬인 쌍선 한 쌍에 모든 노드가 짧은 가지로 매달린다 (멀티드롭 버스)</text>
  <text x="450.0" y="282.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="normal">버스의 양 끝(가장 먼 두 노드)에만 120 Ω을 단다. 두 저항이 병렬이라 CANH–CANL 사이는 60 Ω이 된다</text>
  <text x="450.0" y="304.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">전원이 꺼진 상태에서 멀티미터로 CANH–CANL 저항을 재면 약 60 Ω이 나와야 한다</text>
