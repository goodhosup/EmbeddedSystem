<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 17-5  비트 타이밍 세그먼트 (한 비트 = 8 TQ, 샘플 지점 75%의 예)</text>
  <rect x="110.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1"/>
  <text x="152.5" y="80.0" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="bold">Sync</text>
  <text x="152.5" y="162.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">1 TQ</text>
  <rect x="195.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <rect x="280.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1"/>
  <text x="280.0" y="80.0" font-size="13" text-anchor="middle" fill="#2f6fdf" font-weight="bold">Prop</text>
  <text x="280.0" y="162.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">2 TQ</text>
  <rect x="365.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <rect x="450.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <rect x="535.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#fdebd7" stroke="#d9730d" stroke-width="1"/>
  <text x="492.5" y="80.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">Phase 1</text>
  <text x="492.5" y="162.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">3 TQ</text>
  <rect x="620.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#efe6fb" stroke="#7048e8" stroke-width="1"/>
  <rect x="705.0" y="90.0" width="85.0" height="50.0" rx="0" fill="#efe6fb" stroke="#7048e8" stroke-width="1"/>
  <text x="705.0" y="80.0" font-size="13" text-anchor="middle" fill="#7048e8" font-weight="bold">Phase 2</text>
  <text x="705.0" y="162.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">2 TQ</text>
  <line x1="620.0" y1="70.0" x2="620.0" y2="190.0" stroke="#d64545" stroke-width="2.5"/>
  <polygon points="620.0,190.0 613.0,204.0 627.0,204.0" fill="#d64545" stroke="#d64545" stroke-width="1"/>
  <text x="620.0" y="222.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">샘플 지점 (6/8 = 75%)</text>
  <line x1="110.0" y1="250.0" x2="790.0" y2="250.0" stroke="#334e68" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="450.0" y="244.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">1비트 (500 kbps면 2 µs, TQ = 250 ns)</text>
  <text x="450.0" y="284.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">Sync: 에지가 와야 하는 곳.  Prop: 선을 따라 신호가 오가는 지연.  Phase1·2: 에지가 어긋나면 늘이고 줄여서 다시 맞춘다(SJW)</text>
  <text x="450.0" y="304.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">버스의 모든 노드가 같은 보레이트와 비슷한 샘플 지점을 써야 한다</text>
</svg>
