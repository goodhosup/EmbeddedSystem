<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 8-5  입력 캡처로 펄스 폭 측정하기</text>
  <text x="126.0" y="100.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">입력 핀</text>
  <path d="M140,110 L300,110 L300,80 L560,80 L560,110 L860,110" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="126.0" y="160.0" font-size="13" text-anchor="end" fill="#1f2933" font-weight="bold">CNT</text>
  <line x1="140.0" y1="330.0" x2="860.0" y2="330.0" stroke="#616e7c" stroke-width="1.2"/>
  <path d="M140,310 L860,160" stroke="#2f6fdf" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <line x1="300.0" y1="114.0" x2="300.0" y2="330.0" stroke="#d64545" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="300" cy="276.7" r="6" fill="#d64545"/>
  <text x="310.0" y="298.7" font-size="13" text-anchor="start" fill="#d64545" font-weight="bold">CCR = 1200</text>
  <text x="300.0" y="72.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="normal">상승 에지에서 캡처</text>
  <line x1="560.0" y1="114.0" x2="560.0" y2="330.0" stroke="#d64545" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="560" cy="222.5" r="6" fill="#d64545"/>
  <text x="570.0" y="244.5" font-size="13" text-anchor="start" fill="#d64545" font-weight="bold">CCR = 2700</text>
  <text x="560.0" y="72.0" font-size="12" text-anchor="middle" fill="#d64545" font-weight="normal">하강 에지에서 캡처</text>
  <line x1="300.0" y1="350.0" x2="560.0" y2="350.0" stroke="#d9730d" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="430.0" y="370.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">펄스 폭 = (2700 − 1200) 틱 = 1500 틱 = 1.5 ms (틱 1 µs일 때)</text>
  <text x="450.0" y="392.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">하드웨어가 에지 순간의 카운터 값을 CCR에 복사하므로, ISR이 늦게 실행되어도 측정값은 정확하다</text>
</svg>
