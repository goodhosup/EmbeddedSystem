<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 8-2  프리스케일러와 오토리로드로 주기 만들기</text>
  <rect x="30.0" y="80.0" width="150.0" height="70.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="105.0" y="112.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">타이머 클럭</text>
  <text x="105.0" y="131.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">16 MHz</text>
  <rect x="240.0" y="80.0" width="190.0" height="70.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="335.0" y="112.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">프리스케일러</text>
  <text x="335.0" y="131.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">÷ (PSC + 1)</text>
  <rect x="490.0" y="80.0" width="190.0" height="70.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="585.0" y="112.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">카운터</text>
  <text x="585.0" y="131.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">0 → ARR, 다시 0</text>
  <rect x="740.0" y="80.0" width="130.0" height="70.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="805.0" y="112.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">업데이트</text>
  <text x="805.0" y="131.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">인터럽트</text>
  <line x1="182.0" y1="115.0" x2="236.0" y2="115.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432.0" y1="115.0" x2="486.0" y2="115.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682.0" y1="115.0" x2="736.0" y2="115.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="209.0" y="106.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">16 MHz</text>
  <text x="459.0" y="106.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">틱</text>
  <rect x="30.0" y="180.0" width="840.0" height="120.0" rx="10" fill="#fafbfc" stroke="#616e7c" stroke-width="1"/>
  <text x="450.0" y="206.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">예: 16 MHz에서 2 Hz(0.5초마다) 인터럽트</text>
  <text x="60.0" y="236.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal">PSC = 15999  →  16 MHz ÷ 16000 = 1 kHz  (틱 하나 = 1 ms)</text>
  <text x="60.0" y="260.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="normal">ARR = 499    →  1 kHz ÷ 500 = 2 Hz</text>
  <text x="60.0" y="284.0" font-size="13" text-anchor="start" fill="#2f6fdf" font-weight="bold">업데이트 주파수 = 타이머 클럭 ÷ ((PSC + 1) × (ARR + 1))</text>
</svg>
