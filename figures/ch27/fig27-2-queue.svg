<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 27-2  큐를 통한 생산자–소비자 구조</text>
  <rect x="40.0" y="90.0" width="170.0" height="56.0" rx="8" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="125.0" y="115.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">producer</text>
  <text x="125.0" y="134.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">100 ms마다 측정</text>
  <rect x="40.0" y="170.0" width="170.0" height="56.0" rx="8" fill="#fdebd7" stroke="#d9730d" stroke-width="1.5"/>
  <text x="125.0" y="195.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">UART ISR</text>
  <text x="125.0" y="214.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">xQueueSendFromISR</text>
  <line x1="212.0" y1="118.0" x2="296.0" y2="150.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="212.0" y1="198.0" x2="296.0" y2="168.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="254.0" y="104.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">xQueueSend</text>
  <rect x="300.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
  <rect x="346.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
  <rect x="392.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
  <rect x="438.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
  <rect x="484.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.3"/>
  <rect x="530.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.3"/>
  <text x="553.0" y="164.0" font-size="11" text-anchor="middle" fill="#2f9e44" font-weight="normal">값</text>
  <rect x="576.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.3"/>
  <text x="599.0" y="164.0" font-size="11" text-anchor="middle" fill="#2f9e44" font-weight="normal">값</text>
  <rect x="622.0" y="136.0" width="46.0" height="46.0" rx="0" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.3"/>
  <text x="645.0" y="164.0" font-size="11" text-anchor="middle" fill="#2f9e44" font-weight="normal">값</text>
  <text x="484.0" y="124.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">큐 (길이 8, 항목은 복사되어 들어간다)</text>
  <text x="668.0" y="200.0" font-size="10" text-anchor="end" fill="#616e7c" font-weight="normal">← 먼저 들어온 것이 먼저 나간다</text>
  <line x1="670.0" y1="159.0" x2="724.0" y2="159.0" stroke="#334e68" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="728.0" y="131.0" width="140.0" height="56.0" rx="8" fill="#e1f4e5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="798.0" y="156.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">consumer</text>
  <text x="798.0" y="175.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">xQueueReceive</text>
  <text x="450.0" y="262.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">큐가 비었으면 consumer는 Blocked (CPU를 쓰지 않음) → 값이 들어오는 순간 깨어난다</text>
  <text x="450.0" y="290.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">큐가 가득 차면 producer는 기다리거나(시간 제한) 바로 실패를 돌려받는다. ISR은 절대 기다리지 않는다</text>
  <text x="450.0" y="318.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">생산자와 소비자는 서로를 모른다. 속도 차이는 큐 길이가 흡수한다</text>
</svg>
