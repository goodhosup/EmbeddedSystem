<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 27-1  경쟁 조건으로 값이 틀어지는 순서</text>
  <text x="230.0" y="66.0" font-size="14" text-anchor="middle" fill="#2f6fdf" font-weight="bold">태스크 A</text>
  <text x="470.0" y="66.0" font-size="14" text-anchor="middle" fill="#d9730d" font-weight="bold">태스크 B</text>
  <text x="720.0" y="66.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">counter (메모리)</text>
  <rect x="120.0" y="92.0" width="220.0" height="38.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.4"/>
  <text x="230.0" y="116.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">v = counter;   → v = 5</text>
  <rect x="680.0" y="96.0" width="80.0" height="30.0" rx="4" fill="#ffffff" stroke="#334e68" stroke-width="1.2"/>
  <text x="720.0" y="116.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">5</text>
  <text x="350.0" y="166.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">── 문맥 전환 ──</text>
  <rect x="360.0" y="192.0" width="220.0" height="38.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="470.0" y="216.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">v = counter;   → v = 5</text>
  <rect x="680.0" y="196.0" width="80.0" height="30.0" rx="4" fill="#ffffff" stroke="#334e68" stroke-width="1.2"/>
  <text x="720.0" y="216.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">5</text>
  <rect x="360.0" y="242.0" width="220.0" height="38.0" rx="6" fill="#fdebd7" stroke="#d9730d" stroke-width="1.4"/>
  <text x="470.0" y="266.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">counter = v + 1;</text>
  <rect x="680.0" y="246.0" width="80.0" height="30.0" rx="4" fill="#ffffff" stroke="#334e68" stroke-width="1.2"/>
  <text x="720.0" y="266.0" font-size="14" text-anchor="middle" fill="#1f2933" font-weight="bold">6</text>
  <text x="350.0" y="316.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">── 문맥 전환 ──</text>
  <rect x="120.0" y="342.0" width="220.0" height="38.0" rx="6" fill="#e3edfd" stroke="#2f6fdf" stroke-width="1.4"/>
  <text x="230.0" y="366.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">counter = v + 1;</text>
  <rect x="680.0" y="346.0" width="80.0" height="30.0" rx="4" fill="#ffffff" stroke="#334e68" stroke-width="1.2"/>
  <text x="720.0" y="366.0" font-size="14" text-anchor="middle" fill="#d64545" font-weight="bold">6</text>
  <line x1="60.0" y1="92.0" x2="60.0" y2="382.0" stroke="#334e68" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="52.0" y="242.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">시간</text>
  <text x="450.0" y="412.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">두 번 더했는데 6. B의 결과를 A가 덮어써서 증가 한 번이 사라졌다</text>
  <text x="450.0" y="436.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">읽기–수정–쓰기 사이에 다른 태스크가 끼어들 수 있으면, 그 구간 전체를 하나로 묶어 보호해야 한다</text>
</svg>
