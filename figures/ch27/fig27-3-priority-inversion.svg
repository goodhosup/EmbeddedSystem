  <text x="858.0" y="418.0" font-size="11" text-anchor="end" fill="#616e7c" font-weight="normal">시간 (ms)</text>
  <text x="450.0" y="452.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal">우선순위 역전: 높은 태스크가 낮은 태스크의 자원을 기다리는 동안, 중간 태스크가 낮은 태스크를 밀어내 높은 태스크까지 늦춘다</text>
  <text x="450.0" y="474.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">뮤텍스는 자원을 쥔 태스크의 우선순위를 기다리는 태스크 중 가장 높은 것으로 잠시 올린다 (예제의 i 명령)</text>
