  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 27-3  우선순위 역전 타임라인과 우선순위 상속으로 해결한 모습</text>
  <text x="60.0" y="66.0" font-size="13" text-anchor="start" fill="#d64545" font-weight="bold">이진 세마포어 (상속 없음)</text>
