  <text x="505.4" y="70.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">high 대기 ≈ 70 ms: 자원과 무관한 med 때문에 늦어진다</text>
  <text x="60.0" y="246.0" font-size="13" text-anchor="start" fill="#2f9e44" font-weight="bold">뮤텍스 (우선순위 상속)</text>
