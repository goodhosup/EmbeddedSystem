<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 33-1  임베디드 장치의 공격면</text>
  <rect x="300.0" y="140.0" width="300.0" height="200.0" rx="12" fill="#e3edfd" stroke="#2f6fdf" stroke-width="2"/>
  <text x="450.0" y="168.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">장치</text>
  <text x="450.0" y="200.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">펌웨어 (Flash)</text>
  <text x="450.0" y="230.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">키, 비밀 (Flash, OTP)</text>
  <text x="450.0" y="260.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">RAM</text>
  <text x="450.0" y="290.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">디버그 포트 (SWD)</text>
  <rect x="60.0" y="70.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
  <text x="170.0" y="91.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">네트워크</text>
  <text x="170.0" y="109.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">Wi-Fi, BLE, MQTT: 원격 공격</text>
  <line x1="280.0" y1="120.0" x2="300.0" y2="140.0" stroke="#d64545" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="340.0" y="60.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
  <text x="450.0" y="81.0" font-size="13" text-anchor="middle" fill="#d64545" font-weight="bold">업데이트 통로</text>
  <text x="450.0" y="99.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">가짜 펌웨어 설치 (32장)</text>
  <line x1="450.0" y1="110.0" x2="450.0" y2="140.0" stroke="#d64545" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="640.0" y="70.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
  <text x="750.0" y="91.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">외부 입력</text>
  <text x="750.0" y="109.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">UART 명령, 파일, 센서 값</text>
  <line x1="640.0" y1="120.0" x2="600.0" y2="140.0" stroke="#d9730d" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="40.0" y="300.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
  <text x="150.0" y="321.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">디버그 포트</text>
  <text x="150.0" y="339.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">SWD로 Flash 읽기, 실행 조작</text>
  <line x1="260.0" y1="325.0" x2="300.0" y2="325.0" stroke="#d9730d" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="40.0" y="400.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#d9730d" stroke-width="1.5"/>
  <text x="150.0" y="421.0" font-size="13" text-anchor="middle" fill="#d9730d" font-weight="bold">물리 접근</text>
  <text x="150.0" y="439.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">Flash 칩 떼어 읽기, 버스 엿보기</text>
  <line x1="260.0" y1="425.0" x2="300.0" y2="340.0" stroke="#d9730d" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="640.0" y="300.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#616e7c" stroke-width="1.5"/>
  <text x="750.0" y="321.0" font-size="13" text-anchor="middle" fill="#616e7c" font-weight="bold">부채널</text>
  <text x="750.0" y="339.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">전력, 전자파, 시간으로 키 추측</text>
  <line x1="640.0" y1="325.0" x2="600.0" y2="325.0" stroke="#616e7c" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="640.0" y="400.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#616e7c" stroke-width="1.5"/>
  <text x="750.0" y="421.0" font-size="13" text-anchor="middle" fill="#616e7c" font-weight="bold">결함 주입</text>
  <text x="750.0" y="439.0" font-size="10" text-anchor="middle" fill="#616e7c" font-weight="normal">전압, 클럭 글리치로 검사 건너뛰기</text>
  <line x1="640.0" y1="425.0" x2="600.0" y2="340.0" stroke="#616e7c" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="450.0" y="484.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">위에서 아래로 갈수록 공격에 장비와 기술이 더 필요하다. 위협 모델링은 이 중 무엇을 막을지 정하는 일이다</text>
</svg>
