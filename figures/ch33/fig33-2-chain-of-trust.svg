<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334e68"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#1f2933" font-weight="bold">그림 33-2  신뢰 체인 (ROM → 부트로더 → 애플리케이션 서명 검증)</text>
  <rect x="60.0" y="90.0" width="220.0" height="110.0" rx="10" fill="#eef1f4" stroke="#334e68" stroke-width="2"/>
  <text x="170.0" y="124.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">ROM 부트 코드</text>
  <text x="170.0" y="150.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">바꿀 수 없음</text>
  <text x="170.0" y="172.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">신뢰의 뿌리</text>
  <line x1="282.0" y1="145.0" x2="348.0" y2="145.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315.0" y="134.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">검증</text>
  <text x="315.0" y="166.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">후 실행</text>
  <rect x="350.0" y="90.0" width="220.0" height="110.0" rx="10" fill="#fdebd7" stroke="#d9730d" stroke-width="2"/>
  <text x="460.0" y="124.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">부트로더</text>
  <text x="460.0" y="150.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">쓰기 보호</text>
  <text x="460.0" y="172.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">공개 키 내장</text>
  <line x1="572.0" y1="145.0" x2="638.0" y2="145.0" stroke="#334e68" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605.0" y="134.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">검증</text>
  <text x="605.0" y="166.0" font-size="11" text-anchor="middle" fill="#d64545" font-weight="bold">후 실행</text>
  <rect x="640.0" y="90.0" width="220.0" height="110.0" rx="10" fill="#e1f4e5" stroke="#2f9e44" stroke-width="2"/>
  <text x="750.0" y="124.0" font-size="15" text-anchor="middle" fill="#1f2933" font-weight="bold">애플리케이션</text>
  <text x="750.0" y="150.0" font-size="12" text-anchor="middle" fill="#616e7c" font-weight="normal">서명된 이미지</text>
  <text x="60.0" y="230.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">칩에 따라 ROM이 부트로더 서명을 검증하는 기능도 있다</text>
  <text x="60.0" y="246.0" font-size="10" text-anchor="start" fill="#616e7c" font-weight="normal">(예: ESP32 Secure Boot, 일부 STM32의 보안 부트 기능)</text>
  <rect x="330.0" y="270.0" width="520.0" height="100.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="346.0" y="294.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">1. 해시 = SHA-256(머리말 앞부분 || 이미지)</text>
  <text x="346.0" y="316.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">2. ECDSA 검증(공개 키, 해시, 서명) → 맞으면 다음</text>
  <text x="346.0" y="338.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">3. 보안 카운터 ≥ 장치에 기록된 값 → 아니면 롤백 거부</text>
  <text x="346.0" y="360.0" font-size="12" text-anchor="start" fill="#1f2933" font-weight="normal">4. 통과하면 점프, 아니면 실행하지 않음 (이전 슬롯 또는 복구 모드)</text>
  <text x="450.0" y="400.0" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="normal">각 단계가 다음 단계를 검증한다. 맨 왼쪽(뿌리)이 바뀔 수 없으므로 전체를 믿을 수 있다</text>
  <text x="450.0" y="420.0" font-size="11" text-anchor="middle" fill="#616e7c" font-weight="normal">개인 키는 장치에 없다: 장치는 공개 키로 확인만 하고, 서명은 회사의 보호된 서버가 한다</text>
</svg>
