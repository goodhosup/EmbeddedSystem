# 39장: stm32f4xx-hal로 LED, 버튼, UART (NUCLEO-F411RE)
[package]
name = "ch39-hal-blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
stm32f4xx-hal = { version = "0.23", features = ["stm32f411"] }

[profile.release]
opt-level = "s"
debug = true          # .elf에만 들어간다 (22장)
lto = true
